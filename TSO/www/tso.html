<!-- ===== APP CSS START ===== -->
<style>
body { font-family: -apple-system, sans-serif; margin:0; padding:0; font-size:18px; line-height:1.45; }
.topbar {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 24px;
  background:#003366;
  color:white;
  position:sticky;
  top:0;
  z-index:50;
  touch-action:pan-y;
}

.topbar .title {
  font-size:20px;
  font-weight:600;
  user-select:none;
  -webkit-user-select:none;
}

.topbar .tabs {
  display:flex;
  gap:24px;
}

.topbar .tabs span {
  cursor:pointer;
  opacity:.9;
}

.topbar .tabs span:hover {
  opacity:1;
}

.hidden { display:none; }
.search-panel {
  padding:10px 24px;
  background:white;
  border-bottom:1px solid #ddd;
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
}
.search-panel.hidden { display:none; }
.search-panel input { flex:1; min-width:220px; max-width:520px; box-sizing:border-box; }
.search-results-title { font-weight:bold; margin:0 0 12px; }
.search-result-group { margin:0 0 16px; }
.search-result-group-title { font-weight:bold; margin-bottom:4px; }
.search-result-list { margin:0; padding-left:22px; }
.search-result-item { margin:0 0 6px; }
.search-result-button {
  border:0;
  padding:0;
  background:transparent;
  color:#003366;
  font:inherit;
  text-align:left;
  cursor:pointer;
}
.search-result-button:hover { text-decoration:underline; }
.search-result-snippet { color:#555; font-size:14px; margin-top:2px; }
.grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); }
.category-card, .resource-card { border:1px solid #ddd; padding:12px; border-radius:6px; background:white; }
.resource-card { position:relative; }
.star { position:absolute; left:8px; top:8px; cursor:pointer; font-size:18px; }
.star.fav { color:gold; }
.resource-main { margin-left:24px; }
.resource-details.collapsed { display:none; }
.button { padding:10px 14px; margin:4px 0; cursor:pointer; }
button,
input,
select,
textarea {
  font-size: 18px;
}
.button.primary { background:#003366; color:white; }
.button.secondary { background:#f7f7f7; color:#333; border:1px solid #bbb; }
.button.danger { background:#aa0000; color:white; }
textarea.big { width:100%; min-height:80px; }
textarea.services-editor { min-height:320px; resize:vertical; }
.services-control-block { margin:10px 0 12px; }
.services-control-header {
  margin-bottom:8px;
  padding:10px 12px;
  border:1px solid #ddd;
  border-radius:6px;
  background:#f7f7f7;
}
.services-hint { font-size:16px; color:#555; margin-top:6px; }
.services-preview-toggle { margin-top:8px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.services-control-header .services-preview-toggle { margin-top:0; }
.services-control-header .services-hint { margin-bottom:0; }
.services-preview-toggle .button.primary { box-shadow:0 0 0 2px rgba(0,51,102,0.18); }
.services-preview-box {
  margin-top:8px;
  border:1px solid #ddd;
  border-radius:6px;
  padding:10px;
  background:#fff;
}
.services-rendered ul { margin:6px 0; padding-left:1.15em; }
.services-rendered .services-line { margin:0; }
.services-rendered .services-blank { min-height:1.1em; }
.services-rendered hr { border:0; border-top:1px solid #ccc; margin:10px 0; }
.print-list-flyer {
  border:1px solid #ddd;
  border-radius:6px;
  padding:16px;
  margin:18px 0 0;
  background:#fff;
}
.print-list-flyer h2 { margin:0 0 12px; }
.print-list-field { margin:0 0 10px; }
.print-resource-separator { border:0; border-top:1px solid #aaa; margin:14px 0; }
.admin-panel { display:flex; gap:20px; }
.admin-box { flex:1; border:1px solid #ddd; padding:12px; }
.category-grid { display:grid; gap:6px; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); }
.verified-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.verified-value { font-weight:600; }
.verified-edit { display:none; margin-top:6px; }
.verified-edit.active { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.resource-browse-wrap { width:min(860px,100%); }
.resource-listbox { width:100%; box-sizing:border-box; }
.resource-browse-actions { margin-top:8px; display:flex; gap:8px; align-items:center; width:100%; }
.resource-browse-actions .spacer { flex:1; }
.admin-panel-title { margin:0 0 4px; }
.admin-action-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.admin-option-row { margin:0; }
.admin-option-row + .admin-action-row { margin-top:12px; }
.admin-note { margin:0 0 10px; line-height:1.4; }
.admin-detail-list { margin:8px 0 0 18px; padding:0; }
.admin-detail-list li { margin:4px 0; }
.resource-editor-grid {
  display:grid;
  gap:10px;
  grid-template-columns:repeat(3, minmax(0, 1fr));
}
.resource-editor-grid .span-2 { grid-column:span 2; }
.resource-editor-grid label input,
.resource-editor-grid label textarea { width:100%; box-sizing:border-box; }
#res_name { text-align:left; width:100%; box-sizing:border-box; }
.verified-warning { color:#aa0000; font-size:13px; margin-top:4px; min-height:1.1em; }
.tag-controls-row { margin-top:8px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.assigned-tags-line { font-size:14px; }
.pdf-attachments-list { margin:6px 0 8px; display:grid; gap:6px; }
.pdf-attachment-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.reload-resources-wrap { margin-top:16px; text-align:right; }
.reload-resources-wrap .button { font-size:14px; padding:7px 10px; }
.app-toast {
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:10001;
  max-width:360px;
  padding:12px 14px;
  border:1px solid #c8d6e5;
  border-radius:6px;
  background:#f7fbff;
  color:#1f2d3d;
  box-shadow:0 2px 10px rgba(0,0,0,.14);
  font-size:14px;
  line-height:1.35;
  white-space:pre-line;
}
.app-toast.hidden { display:none; }
.app-toast.important {
  max-width:460px;
  border:2px solid #b45309;
  background:#fff7ed;
  color:#7c2d12;
  font-weight:bold;
}
.category-order-input { appearance:textfield; -moz-appearance:textfield; }
.category-order-input::-webkit-outer-spin-button,
.category-order-input::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }

.reference-modal {
  position:fixed;
  inset:0;
  z-index:10002;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:18px;
  box-sizing:border-box;
  background:rgba(0,0,0,.45);
}
.reference-modal.hidden { display:none; }
.reference-modal-panel {
  width:min(720px,100%);
  max-height:min(82vh,720px);
  display:flex;
  flex-direction:column;
  background:white;
  border:1px solid #c8d6e5;
  border-radius:6px;
  box-shadow:0 8px 28px rgba(0,0,0,.22);
}
.reference-modal-header {
  display:flex;
  justify-content:space-between;
  gap:16px;
  padding:16px 18px;
  border-bottom:1px solid #dde6ef;
}
.reference-modal-title { font-size:20px; font-weight:bold; }
.reference-modal-subtitle { margin-top:2px; color:#555; }
.reference-modal-body {
  padding:16px 18px 18px;
  overflow:auto;
}
.reference-group { margin-top:14px; }
.reference-group:first-child { margin-top:0; }
.reference-group-title { font-weight:bold; margin-bottom:6px; }
.reference-list { margin:0; padding-left:22px; }
.reference-match { margin-bottom:10px; }
.reference-match:last-child { margin-bottom:0; }
.reference-match-name { font-weight:bold; }
.reference-match-categories { color:#555; font-size:14px; }
.reference-match-snippet { margin-top:3px; color:#333; font-size:14px; }
.reference-empty { margin:0; color:#555; }

/* Print modal */
#printModal {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:flex;
  justify-content:center;
  align-items:center;
}
#printModal.hidden { display:none; }
#printContentWrapper {
  background:white;
  padding:20px;
  max-height:90%;
  overflow:auto;
  width:800px;
}
@media print {
  @page {
    margin: 0.75in;
  }

  body {
    background: white;
  }

  body > *:not(#printModal):not(#referenceModal) {
    display: none !important;
  }

  #printModal {
    position: static;
    inset: auto;
    background: transparent;
    display: block;
  }

  #printContentWrapper {
    position: static;
    left: auto;
    top: auto;
    width: auto;
    max-height: none;
    overflow: visible;
    padding: 0;
    margin: 0;
    background: transparent;
    font-size: 11pt;
    line-height: 1.3;
  }

  #printContentWrapper button {
    display: none !important;
  }

  #referenceModal {
    position: static;
    inset: auto;
    display: block;
    padding: 0;
    background: transparent;
  }

  #referenceModal.hidden {
    display: none !important;
  }

  .reference-modal-panel {
    width: auto;
    max-height: none;
    display: block;
    border: none;
    border-radius: 0;
    box-shadow: none;
    background: transparent;
  }

  .reference-modal-header {
    padding: 0 0 12pt;
    margin-bottom: 12pt;
    border-bottom: 1px solid #aaa;
  }

  .reference-modal-title {
    font-size: 16pt;
  }

  .reference-modal-body {
    padding: 0;
    overflow: visible;
    font-size: 11pt;
    line-height: 1.35;
  }

  .reference-modal-close {
    display: none !important;
  }

  .resource-card {
    border: none;
    padding: 0;
    margin-bottom: 11pt;
    break-inside: avoid;
    page-break-inside: avoid;
    background: transparent;
  }

  .resource-card ul {
    margin-top: 4pt;
    margin-bottom: 4pt;
    padding-left: 14pt;
  }

  .print-resource-separator {
    border: 0;
    border-top: 1px solid #999;
    margin: 10pt 0;
  }

  .print-list-flyer {
    border: none;
    border-radius: 0;
    padding: 0;
    margin: 0;
    background: transparent;
  }

  .print-list-flyer-page-break {
    break-before: page;
    page-break-before: always;
  }
}

      "displayOrder": null,
      "servicesText": "**United Way of Utah County **\nWebsite: www.unitedwayuc.org \n\n**Locations: **\n\n**Main Office **\n* 148 North 100 West, Provo, UT  84601 \n* 801-374-2588 \n* Monday – Friday 8:30am – 5:00pm \n\n**South Franklin (Provo Community Center) **\n* 770 S 700 W, Provo, UT 84601 \n* 801-691-5347 \n\n**American Fork **\n* 90 S Center St, American Fork 84003 \n* 801-980-3775 \n\n**Payson **\n* 41 N 400 W, Payson, UT 84651 \n* 385-438-1050 \n\n**Services Offered: **\n\n**Volunteer Income Tax Assistance (VITA) **\n* Free Tax Preparation Assistance for families earning $67,000 or less. \n* Appointments through April 15th. \n* English and Spanish. \n* See website for details: www.unitedwayuc.org/our-work/everyday-support/vita/ \n\n**Welcome Baby **\n* Surrounds parents with practical tools, trusted guidance, and meaningful connection through home visits, early learning workshops, playgroups, and bedtime storytelling programs.  \n* Each service is designed to nurture children, strengthen families, and help our community’s youngest residents start strong.  \n* See website for programs offered and how sign up. www.unitedwayuc.org/welcome-baby/ \n\n**Help Me Grow Utah: **\n* Help Me Grow Utah is a free information and referral helpline that provides parents, physicians, and community partners all across Utah with resources to make a difference in the lives of pregnant parents and families with children 8 and under. \n* We share our knowledge with you through text, email, phone calls, and mail \n* All services are available in English and Spanish. \n* Monday-Thursday 8:30am - 8:30 pm \n* Friday 8:30am – 5:00pm., Saturday 10:00am – 2:00pm. \n* Call/Text 801-691-5322 \n* Email: helpmegrow@unitedwayuc.org \n\n**Everyday Strong **\n* Classes for parents, teachers, friends or neighbors, to show you how to help your child feel safe, connected and confident using real-life tools, simple conversation starters, and supportive community.  \n* Handbook, videos, and podcast online and calendar for a class near you. \n* www.unitedwayuc.org/our-work/everyday-strong/ \n\n**Digital Literacy **\n* Beginner and advanced classes that cover basic computer skills, job preparation and resume skills.  \n* Graduates receive a donated computer.  \n* Register online.  www.unitedwayuc.org/our-work/everyday-support/digital-literacy/ \n\n**Utah Valley Rides and Paratransit  **\n* Provides transportation services to seniors in Utah County.  \n* See www.unitedwayuc.org/utah-valley-rides/ for more information and days available in your city. \n* Call 801-471-0601 to schedule \n\n**Community Center:  **\n* Where learning, connection, and stability is brought closer to home. \n \n**Sub for Santa **\n\n**211 Utah: **\n* Connects you to the support you need when in crisis or difficult circumstances.  \n* It’s free, confidential, and available in multiple languages.  \n* Dial 211 or go to website www.utah211.org \n",

    {
      "id": "GED",
      "name": "Adult Education - GED/HS Diploma",
      "phone": "",
      "website": "",
      "address": "",
      "hours": "",
      "description": "Local educational resources for adults seeking to obtain their GED or High School diploma.",
      "categories": [
        "education"

      "verifiedBy": "",
      "displayOrder": null,
      "evaluation": {},
      "favorite": false,
      "lastModified": "2026-05-05T19:57:32.649Z",
      "servicesText": "**Provo City School District Adult Education**\n* High School Diploma: Call 801-374-4840 to earn a credit-based high school diploma through courses at Provo Adult Education.\n* GED – Utah High School Completion Diploma: Call 801-374-4840 for GED preparation. The GED test is taken at a UVU testing center.\n* Cost: $36 per test (4 tests: English, Math, Science, Social Studies).  Limited vouchers available for those who attend at least 12 hours of class.\n* Department of Workforce Services (DWFS) may offer resources to pay for the GED exam.\n---\n**Alpine Adult Education** (adulted.alpineschools.org)\nAddress: 778 Bamberger Dr., American Fork, UT 84003\nPhone: 801-610-8188 (Text: 385-269-0809)\n**GED Prep (Ages 16+)**\n* Call to set up an appointment.\n* Register in person with a valid Utah ID.\n* Take an assessment test.\n* Meet with a teacher/counselor to plan GED goals.\n* Vouchers available for test fees. Classes are free.\n\n**High School Diploma**\n* Call to set up an appointment.\n* Register in person with a valid Utah ID.\n* Take an assessment test.\n* Meet with a teacher/counselor to go over remaining graduation requirements.\n* Remaining HS credits can be earned by completing courses through East Shore Online High School\n* Cost is $50 for 1-year of access to East Shore Online High School.\n---\n**Nebo Adult Education**\nAddress:  612 S. MainStreet, Spanish Fork, UT  (Landmark High School - enter at the back of the building)\nPhone:  801-798-4093\nOffice Hours:  Monday - Friday 8:00am - 4:00pm\n\n**GED**\n* Study programs available in English and Spanish\n* Must have a legal ID\n* Fee one-time $50 as long as the program is completed\n* Initial assessment will be made\n* Program meets Monday and Wednesday (5:00pm - 8:00pm) for beginning level and Tuesday and Thursday (5:00pm - 8:00pm) for advanced level\n* GED test is taken at UVU and has a $36 cost per test\n\n**Adult High School Diploma**\n* Status is determined by using the last available High School transcript\n* Must have a legal ID\n$50 fee applies\n---\n**UVU School Community University Partnership (SCUP)**\nPhone 801-863-8838\nwebsite: www.uvu.edu/partnership/spanish-ged/\n\n* Spanish GED is free, focused on math but also offers social skills\n* Classes meet in the UVU Liberal Arts Building (rooms 105 and 106) every Saturday\n* New classes start in January and August\n* GED test (there are 4) cost $36 each\n---\n**Department of Workforce Services** (jobs.utah.gov)\nResources for GED/HS Diploma:\n* Financial assistance for GED study, tutoring, and testing.\n* Cash incentives for youth (ages 14–24) who complete GED or HS diploma.\n* Apply online or in person at a local employment center.\n* Meet with an employment counselor to determine eligibility.\n\nOffices in Provo, Spanish Fork, and Lehi (call 801-526-0950 for all Utah County offices).\nOffices open 8 am–5 pm, Monday–Friday.",

      "lastModified": "2026-05-06T18:02:32.653Z",
      "servicesText": "**\"Live Your Dream Foundation\"**\n$500 - $3,000 scholarships for single mothers with a dependent at home, applicable to the university, college, or technical school of your choice.\nApplication, deadline to apply, and eligibility requirements can be found at:\nhttp://www.liveyourdreamfoundation.org/apply\nApplication Deadline for Fall 2026: April 10, 2026\n---\n**\"Stella H. Oaks Foundation\"**\nScholarships for single mothers.\nApplication, deadline to apply, and eligibility requirements can be found at:\nhttp://www.stellahoaks.org/scholarship\nApplication Deadline for Summer 2026 Semester: March 14, 2026\nApplication Deadline for Fall 2026 Semester: July 1, 2026\n---\n**\"Ensign College\"**\nScholarships for Ensign College students who are single parents with a dependent child in the home.\nFree Application for Federal Student Aid (FAFSA) is required for domestic students.\nApplication, deadline to apply, and eligibility requirements can be found at:\nmailto:scholarships@ensign.edu\nOr by calling 801-524-8111\n---\n**Note: All websites share additional resources for single moms.**",

    {
      "id": "career_education",
      "name": "Career Education",
      "phone": "",
      "website": "",

      "hours": "",
      "description": "Training and apprenticeship resources",
      "categories": [
        "education"
      ],
      "verifiedBy": "",

      "evaluation": {},
      "favorite": false,
      "lastModified": "2026-05-13T05:17:27.245Z",
      "servicesText": "**Path to Pro (pathtopro.com)**\nWould you like training for a career in the trades? Home Depot offers a free, self-paced virtual training platform for learning a trade. Some of the career trades offered are drywall, paint, plumbing, electrical, welding, and others. \nGo to their website pathtopro.com and register online. \n---\n**Proxima Careers (proximacareers.org)**\nInterested in a healthcare pathway? Proxima helps support and get you started in a Certified Nursing Assistant, Medical Assistant, Pharmacy Tech, or Emergency Medical Technician training program at no cost to you. \nEligibility: \n* Be 16+ years old \n* Able to work in the USA \n* Able to work 36+ hours after program completion at one of our employer partners \n* Facing barriers to healthcare education \nSee website (proximacareers.org) to sign up or for more information. Openings are limited. \n---\n**Provo City School District Adult Education**\nAdult Basic Education: (801-374-4840) Adult classes designed to build basic skills in English and Math. \nAdult English Language Learning: (801-374-4904) If English is not a person's first language, the adult English classes provide English instruction. Call first as there is a wait list. Currently, the English classes are given at 750 West 200 North, Provo, until June 2026 when the building will be torn down. \n---\n**Alpine Adult Education (adulted.alpineschools.org)**\n778 Bamberger Dr., American Fork, UT 84003 \n801-610-8188 (for text only 385-269-0809) \nEnglish Language Learners (ELL) for all levels: \nTo register or get more information, call 801-227-8782. There is a $20 fee plus $10-30 book fees depending on the level. Nursery and/or preschool may be available to those who qualify. Classes in Orem (call 801-227-8782), Eagle Mountain (call 801-610-8897), or Saratoga Springs (call 801-901-0855) for more information or see their website adulted.alpineschools.org.\n---\n**Captain Your Story - My Story Matters**\nTools to change yourself and become the person you want to be. If you face: \n* Fear of the unknown regarding your future. \n* Guilt and self-blame for perceived failures. \n* Frustration and helplessness in accessing appropriate resources and working with the system. \n* Anxiety about the impact of employment on family dynamics and relationships. \n* Stigma and judgement from social groups, adding to your isolation. \n* Emotional exhaustion from constant worry and stress. \nCaptain Your Story teaches core values and life skills. The practices and strategies are research-based. Learning is in person with an instructor, self-guided workbook. You will also be working with a mentor. \nFor more information: \n801-477-7071 \nMystorymatters.org \nmailto:Office@mystorymatters.org \nScholarships available. \n---\n**Project Read, Math, and Digital Skills (ProjectReadUtah.org)**\nProject Read: Provides small group instruction as well as one-on-one tutoring to help individuals improve their ability to read and write, fill out job applications, create a budget, financial literacy and banking skills, health literacy, workforce prep, civics education. \n---\nProject Math: Everyday math skills.\n---\nProject Digital Skills: Essential computer and software skills, including Windows/Mac OS, Word, Excel, PowerPoint, Google Docs, social media, career search skills, and technology in daily life. \nQualifications:\n* At least 16 years old. \n* Have basic English skills. \n* Read and write below a high school level. \n* Provide proof of Utah residency. \n* Commit to 6 instructional hours a week. \n* Complete required testing. \n* Pay associated program fees ($20/year and $20 for use of materials. The $20 materials fee is refundable at the end of the course if all materials are returned). \nScholarships available. \nSubmission form online. Call 801-448-7323 if you need help filling out. \nProject Read Office in Provo Library: \n550 North University Ave. Room #215, Provo, UT 84601 \n801-448-7323 \nHours: Tuesday - Thursday 10 am - 7 pm. \nFriday 10 am - 4 pm. \n---\n**Mountainland Technical College (mtec.edu)**\nOffering classes in:\n* Healthcare (EMT, Dental Asst., Medical Asst., Pharmacy Tech, and more) \n* Services (Cosmetology, Culinary Arts, Nail Tech and more) \n* Trades (Automotive, Diesel, Welding, Commercial Driver's License, etc) \n* Technology (Information Tech, Web Programming, etc.) \n* Apprenticeships (Electrical, HVACR Tech, Plumbing) \n\"Information Sessions\" in person or virtual. Covers financial information, registration info, program details, scholarship info etc. Sign up on their website, opening page \"View Session Dates\". \nCampuses in Lehi, Orem, Provo, Spanish Fork, Payson. \nFor more information, fill out the form online under \"contact\" or call 801-753-6282. Or register and attend an \"Information Session\" as mentioned above. \n---\n**Department of Workforce Services (jobs.utah.gov)**\nIf you are seeking an occupational license or professional certification DWFS may be able to help with the following resources: \n* Paying for tuition, books, and required supplies. \n* Paying required testing and licensing fees. \n* Connecting with and paying for tutoring services, personalized coaching and financial support including applying for financial aid and navigating post-secondary education. \n* Cash incentives for youth for completion of program. \n* Apprenticeship opportunities: DWFS may be able to help find and research apprenticeship programs as well as provide funding for classroom training and required supplies. \n* Completing a College Degree: Paying for tuition, books and required supplies as well as resources listed above. \n* Paid internship opportunities to explore careers and gain workplace skills. Career assessment. \nHow to apply: \nGo to jobs.utah.gov/career. Select the service or support you are interested in. \nClick \"How to Apply\" and then \"Apply Now\" to apply online. \nIf you do not have a Utah ID account, you will need to create one. \nOr visit the nearest DWFS Employment Center. \nTo receive funding you must meet eligibility requirements which vary based on program. \nCall 801-526-0950 (for all Utah County offices) for more information or go online to jobs.utah.gov. \nOffices open 8 am-5pm Monday-Friday in: \n1550 North 200 West (Provo 84604) \n1185 N. Canyon Creek Parkway (Spanish Fork 84660) \n557 West State St. (Lehi 84043",

      "lastModified": "2026-05-06T22:48:11.468Z",
      "servicesText": "---\n**Path to Pro** (pathtopro.com)\nWould you like training for a career in the trades? Home Depot is offering a free, self‑paced virtual training platform for learning a trade. Some of the career trades offered are drywall, paint, plumbing, electrical, welding and others. Go to their website pathtopro.com and register online.\n---\n**Proxima Careers** (proximacareers.org)\nInterested in a healthcare pathway? Proxima helps support and get you started in a Certified Nursing Assistant, Medical Assistant, Pharmacy Tech, or Emergency Medical Technician training program at no cost to you.\nEligibility:\n* Be 16+ years old\n* Able to work in the USA\n* Able to work 36+ hours after program completion at one of our employer partners\n* Facing barriers to healthcare education\nSee website to sign up. Openings are limited.\nLocations mentioned:\nSpanish Fork 84660\n557 West State St. (Lehi 84043)\n---\n**Mountainland Technical College** (mtec.edu)\nOffering classes in:\n* Healthcare (EMT, Dental Asst., Medical Asst., Pharmacy Tech, and more)\n* Services (Cosmetology, Culinary Arts, Nail Tech and more)\n* Trades (Automotive, Diesel, Welding, CDL, etc.)\n* Technology (Information Tech, Web Programming, etc.)\n* Apprenticeships (Electrical, HVACR, Plumbing)\n“In‑person or virtual” Information Sessions cover financial info, registration, program details, scholarships, etc. Sign up on their website (opening page → “View Session Dates”).\nCampuses: Lehi, Orem, Provo, Spanish Fork, Payson.\nFor more information:\nFill out the online contact form\nCall 801‑753‑6282\nOr attend an Information Session\n---\n**Department of Workforce Services – DWS** (jobs.utah.gov)\nIf you are seeking an occupational license or professional certification, DWS may help with:\n* Tuition, books, and supplies\n* Testing and licensing fees\n* Tutoring services\n* Personalized coaching\n* Financial aid navigation\n* Cash incentives for youth\n* Apprenticeship funding (classroom training + supplies)\n* Degree completion support\n* Paid internships\n* Career assessment\nHow to apply:\nGo to jobs.utah.gov/career\nSelect the service/support\nClick How to Apply → Apply Now\nCreate a Utah ID if needed\nOr visit a local DWS office\nEligibility depends on the program.\nPhone: 801‑526‑0950\nUtah County offices:\n1550 North 200 West (Provo 84604)\n1185 N. Canyon Creek Parkway (Spanish Fork 84660)\n557 West State St. (Lehi 84043)\nHours: Mon–Fri, 8am–5pm\n---\n**Job Corps** (enroll.jobcorps.gov)\nJob Corps is the largest free residential education and job‑training program for young adults (ages 16–24) who are disadvantaged, low income, disabled, homeless, etc.\nCenters house 120–240 students, except Clearfield (~1,000).\nZero tolerance for drugs/alcohol.\nCenter assigned based on chosen trade.\nApplication:\nApply at enroll.jobcorps.gov\nApplication goes to an admissions counselor based on ZIP code\nProcessing time: ~2 months\nExpedited for applicants without housing\nCourt‑related requirements must be complete (if applicable)\nDocumentation (if applicable):\n* Transcripts/Diploma\n* Immunization Record\n* Background check\n* ID/Birth Certificate/Social Security Card\n* Medicaid/Insurance card\n* Mental health diagnosis/IEP\n* Income (past 6 months): SNAP, SSI/SSDI, Medicaid, free/reduced lunch\nIncluded:\n* Furnished dorms\n* Work clothing\n* Basic medical care\n* Living allowance ($45–$70 every 2 weeks after 6 months)\n* Books and supplies\nFree Training:\n* High school diploma\n* Driver’s education\n* Personal career development\n* Fundamental employment skills\n* Tutoring: English, Math, Reading\nClasses offered: Carpentry, welding, electrical, forestry, firefighting, automotive, plumbing, medical, dental, and more.\nFor questions: 801‑479‑9806\n---\n**Utah Transit Authority (UTA) Bus Operator Training/Certification Program**\n\nMinimum Qualifications (See UTA Bus Operator Information Packet attached to this resource list). \n* Minimum of 21 years old. \n* Valid Utah Drivers License. \n* No more than 2 moving violations in the last 3 years. \n* No DUI convictions in the last 10 years. \n* 1 year of customer service experience \n* Required to pass CDL test at least one week prior to starting training. \n\nSee information packet for more qualifications and information to apply. \n\n**UTA has other internal training programs for Maintenance, Commercial Driver License, TRAX and Streetcar operations, and others. Explore training options at: www.careers.rideuta.com/pages/we-wre-uta** \n--- \n**DevPipeline**\n\nDevPipeline is an apprenticeship program that combines coding education with practical work experience. The program completes in 45 weeks creating employable software developers. For more information send an email to info@devpipeline.com \n\nAlso see Department of Workforce Services apprenticeships. \n---\n**BYU Pathway Worldwide **\nwww.byupathway.edu \n\nBYU-Pathway Worldwide is a higher education organization supported by the Church of Jesus Christ of Latter-Day Saints. You do not need to be a member to attend, however tuition is 25% higher for non-members.  It serves students in more than 180 countries and offers a select list of U.S. accredited certificates and degrees in partnership with BYU-Idaho and Ensign College. Classes are online. Tuition is significantly lower than most universities with a guaranteed 10-50% tuition discount. See website for details including degrees and certificates offered, tuition, and admission application. \n\n ",

      "servicesText": "---\n**LG Resources** (LGresources.com)\n363 N. University Ave. Suite 101, Provo, UT 84601\n801-900-4726 (text to 385-501-7701)\nMainly temp to hire positions, occasional temp for a few days\nJobs: General labor (cleanup at construction sites, warehouse, light industrial, janitorial, landscaping, clerical, welders, HVAC, electrical)\nMust have 1 year of experience and resume\nComplete application online, contact the office for an interview between 9-4\nBackground checks and drug screens required. In some cases, medical marijuana use is OK—bring your card to the interview. Exiting incarceration may be OK depending on the offense and how recently they were jailed.\n---\n**Apex Staffing** (apexjobs.net)\n1160 S. State St. Suite 220, Orem, UT 84097\nConstruction and industrial jobs\nApplications accepted Monday–Friday 9 am–2 pm\nFT, PT, short and long term temporary staffing as well as temp to hire staffing\nFriendly to those exiting corrections\n---\n**Ascend Staffing** (ascendstaffing.com)\n1651 N. State St., Orem, UT 84057\n801-374-8000\nRequire GED or HS diploma\nAble to work in US\nExcellent communication skills\nBackground check\nFT, PT paid weekly\nLight industrial and skilled trades 1\n---\n**Elwood Staffing** (Elwoodstaffing.com)\n4 offices offering positions in general labor, construction, warehouse production and shipping, manufacturing, and skilled labor jobs (carpentry, welding, etc.)\nMost jobs require no experience (skilled labor jobs prefer experience and a resume)\nAll offices open 9–5, M–F. Complete an online account and applications before job search\nAlmost every job requires a background check (generally “second chance” friendly) and drug screen. Medical marijuana users will not qualify due to THC in the test\nJobs may be short in duration or temp to hire\nEligibility Requirements:\nMust have transportation (many places not serviced by UTA)\nWarehouse jobs are usually shift work—ability to work all shifts\nMany require steel toe boots, ability to lift 50 lbs or more, and clothing appropriate for outdoor work\nOffices:\nElwood Skill Staff: 1256 S. State St. #104, Orem, UT 84057, 801-426-4948 (skilled trades)\nElwood Staffing: 1256 S. State St. #101, Orem, UT 84057, 801-225-1010 (warehouse, production, shipping in Provo/Orem)\nElwood Staffing – American Fork: 72 South 360 East, American Fork, UT 84003, 801-492-1525 (production/warehouse jobs in Lindon and north Utah County)\nElwood Staffing – Spanish Fork: 61 East 1000 North, Spanish Fork, UT 84660, 801-798-0052 (warehouse/production jobs in Springville and south Utah County) 1\n---\n**Utah Construction Personnel** (UCPStaffing.com)\n590 N. State St., Orem, UT 84057\n801-227-7171\nConstruction and general labor jobs. Must be drug free. Veteran friendly\n---\n**Nexeo Staffing** (Nexeostaffing.com)\n1417 S. State St., Orem, UT 84057\n801-841-4000\nFT, PT, Temporary: warehouse, customer service, accounting, admin, clerical, construction, welding. Many jobs want a resume. Nexeo will help you prepare one if needed\nGenerally paid weekly\nBackground check and drug screen if required by client\nAdditional Utah locations—see website\n---\n**Kelly Services** (Kellyservices.us)\n2255 N. University Parkway Suite 7, Provo, UT 84604\n801-373-1616\nSubstitute teachers, light industrial, electronic assembly, professional\nBackground checks and drug screens as required by employer\nFT, PT, Temporary\n---\n**Indeed.com**\nCreate an account online to see your job recommendations\nFilter by pay, job type, experience level, education, etc.",

      "servicesText": "---\n**People Ready** (PeopleReady.com)\nLocation: 175 S. Freedom Blvd. Provo, UT 84601\nPhone: 801-561-0881\nEmail: mailto:1432-br@peopleready.com\nType: Temporary employment agency for general labor, construction, hospitality, retail, manufacturing, warehouse/distribution, housekeeping/janitorial, disaster restoration, and more.\nFeatures:\nBuild your own schedule.\nMany jobs offer next-day pay.\nPayment via direct deposit, check, or pay card.\nRequirements:\nSmartphone to download the “Jobstack” app (for applying and job notifications).\nTwo forms of ID (e.g., non-expired picture ID, Social Security card, jail release papers, birth certificate).\nMay need steel toe shoes and long pants for most jobs.\n---\n**Bacon** (Baconwork.com)\nType: On-demand work—pick up shifts when you want using the “Baconwork OnDemand” app.\nFeatures:\nView shift details (company, time, pay, type of work).\nFlexible, temporary work (event staffing, catering, warehouse, general labor, etc.).\nNo specific skill required—just willingness to work hard.\nYou control your schedule.\nAfter each shift, you’re rated (1–5 stars); payment follows rating.\n---\n**GigSmart** Get Gigs App (Gigsmart.com)\nType: On-demand temporary or residential project work; full and part-time jobs.\nHow it works:\nDownload the app and create a work profile.\nBrowse and apply for positions based on your interests and experience.\nAccept shifts that suit you.\nEarnings are transferred automatically after timesheet approval.\n---\n**Department of Workforce Services** (jobs.utah.gov)\nApp: “Utah Jobs” mobile app.\nFeatures:\nSet up an account entirely on the app.\nSearch jobs easily.\nTarget jobs by area and keywords.\nAdd jobs to favorites or remove those you’re not interested in.\n---\n**Rover App** (Rover.com)\nType: Become a pet sitter (dogs and cats only).\nFeatures:\nSet your own schedule and prices.\nGet paid two days after a completed service.\nMust pass a background check.\nHow to get started:\nDownload the “Rover” app.\nChoose services (pet boarding, house sitting, dog walking, drop-in visits, doggy daycare, dog training).\nSet rates, availability, and pet preferences.\nCreate your profile (experience, etc.).\nRequest testimonials from past clients.\nComplete a safety quiz and background check.",

PM, 2nd & 4th Saturdays 10 AM- 12 PM  \n* 50 East 100 North, Spanish Fork, UT 84660\n* 801-709-8573   \n* https://tabithasway.org/  \n---\n**MEALS AT FOOD & CARE COALITION (299 E 900 S, Provo, UT)** \n* Monday – Friday: \t                Saturday:  \n  Breakfast: 8:30 am – 9:30 am \t \tBreakfast: 8:30 am – 9:30 am  \n  Lunch: 12:00 pm – 1:00 pm \t \tLunch: 12:00 pm – 1:00 pm  \n  Dinner: 4:30 pm – 5:30 pm \t \tDinner: 4:30 pm – 5:30 pm  \n* Sunday and Holidays:                       \n  Lunch: 12:00 pm – 1:00 pm   \n---\n\n**2026 MOBILE PANTRY for UTAH COUNTY (January to December) (Dispensa de Alimentos Movíl — Enero hasta Diciembre)**\n\n**BENJAMIN Mobile Pantry:** 6:30-8:30 AM FRIDAYS (Viernes)  \n* 1138 West 100 South, Spanish Fork, UT\n* Dates: 1/2, 1/9, 1/23, 2/6, 2/20, 3/6, 3/20, 4/3, 4/10, 4/25, 5/8, 5/22, 6/5, 7/10, 8/7, 8/21, 9/4, 9/11, 9/25, 10/09, 10/23, 11/6, 11/20, 12/4, 12/11  \n---\n**EUREKA Mobile Pantry** 12:00-1:00 PM WEDNESDAYS (Miércoles)  \n* 70 E Main Street, Eureka, UT\n* Dates: 1/28, 2/25, 3/25, 4/29, 5/27, 6/24, 7/29, 8/26, 9/30, 10/28, 11/25, 12/30  \n---\n**GOSHEN Mobile Pantry: 10:00-11:00 AM WEDNESDAYS (Miércoles)  \n* 79 South Center Street, Goshen, UT\n* Dates: 1/28, 2/25, 3/25, 4/29, 5/27, 6/24, 7/29, 8/26, 9/30, 10/28, 11/25, 12/30  \n---\n**LEHI Peaks Mobile Pantry** 8:30-9:30 AM THURSDAYS (Jueves)  \n* 1149 North 300 West, Lehi, UT\n* Dates: 1/8, 1/22, 2/5, 2/19, 3/5, 3/19, 4/9, 4/23, 5/7, 5/21, 6/4, 6/18, 7/9, 7/23, 8/6, 8/20, 9/10, 9/24, 10/8, 10/22, 11/5, 11/19, 12/10  \n---\n**OREM Sharon Park Mobile Pantry** 8:00-9:00 AM MONDAYS (Lunes)  \n* 85 East 700 North, Orem, Utah\n* Dates: 1/5, 2/2, 3/2, 3/16, 3/30, 4/6, 4/20, 5/4, 5/18, 6/1, 6/15, 6/29, 7/6, 7/20, 8/3, 8/17, 8/31, 9/21, 10/5, 10/19, 11/2, 11/16, 11/30, 12/7, 12/21  \n---\n**PAYSON Tabitha’s Way Mobile Pantry** 7:45-8:45 AM FRIDAYS (Viernes)  \n* 608 W 1400 S, Payson, UT\n* Dates: 1/16, 1/30, 2/13, 2/27, 3/13, 3/27, 4/17, 5/1, 5/15, 5/29, 6/12, 6/26, 7/17, 7/31, 8/14, 8/28, 9/18, 10/2, 10/16, 10/30, 11/13, 12/18  \n---\n\n**SNAP (Supplemental Nutrition Assistance Program)**\n* You may qualify for SNAP benefits. Talk to an eligibility specialist at the Department of Workforce Services. Benefits start the day you apply, and applications are expedited if you’re homeless. \n* Learn more and apply at: https://mydoorway.utah.gov/food-assistance-snap/  \n---\n\n**WIC (Women, Infants & Children)**\n* WIC provides nutrition services and healthy foods for eligible pregnant, postpartum, and breastfeeding women, plus infants and children up to age 5. \n* Learn more and apply at: https://wic.utah.gov/4744   ",

      "servicesText": "---\n**Domestic Violence Shelters in Utah**\n---\n**Community Abuse Prevention Services Agency** (CAPSA)\nLocation: Logan\nService Area: Cache and Rich Counties\nPhone: (435) 753-2500 (24hr)\nWebsite: capsa.org\nServices: Emergency shelter, 24-hour crisis line, case management, transitional housing, counseling & support groups, transportation, children's services, food, personal care items, advocacy, referral programs.\n---\n**New Hope Crisis Center**\nLocation: Brigham City\nService Area: Box Elder County\nPhone: (435) 723-5600 or 1-877-732-5600 (24hr)\nWebsite: newhopecrisiscenter.org\nServices: Same as above.\n---\n**YCC Family Crisis Center**\nLocation: Ogden\nService Area: Weber and Morgan County\nPhone: (801) 394-9456 (24/7), (801) 394-6552 (Rape Crisis), 1-844-762-8483 (Stronghearts Native Helpline)\nWebsite: yccogden.org\nServices: Same as above.\n---\n**Safe Harbor Crisis Center**\nLocation: Davis County\nService Area: Davis County\nPhone: (801) 444-9161 (24hr)\nWebsite: safeharborhope.org\nServices: Same as above.\n---\n**YWCA Utah** (for women, men, and children)\nLocation: Salt Lake City\nService Area: Salt Lake County\nPhone: (801) 537-8600 (24hr)\nWebsite: ywcautah.org\nServices: Same as above.\n---\n**Peace House**\nLocation: Park City\nService Area: Summit and Wasatch Counties\nPhone: (435) 647-9161 (24hr)\nWebsite: peacehouse.org\nServices: Same as above.\n---\n**South Valley Services** (SVS)\nLocation: West Jordan\nService Area: Salt Lake and Utah Counties\nPhone: (801) 255-1095 (24hr)\nWebsite: svsutah.org\nServices: Same as above.\n---\n**Pathways Domestic Violence Shelter & Survivor Advocacy Center**\nLocation: 7 South Main St, Suite 305, Tooele (Mon-Thurs 8am-5pm)\nService Area: Tooele County\nPhone: (435) 231-3557 (24hr)\nWebsite: svsutah.org/get-help-now/pathways-svs/\nServices: Same as above.\n---\n**The Refuge Utah**\nLocation: Provo\nService Area: Utah and Juab Counties\nPhone: (801) 377-5500 (DV Crisis 24hr), (801) 356-2511 (Sexual Assault Services 24hr)\nWebsite: therefugeutah.org\nServices: Same as above.\n---\n**Friends Against Family Violence**\nLocation: Vernal and Roosevelt\nService Area: Uintah, Duchesne, and Daggett Counties\nPhone: (435) 781-2264 (24hr)\nWebsite: fafv.org\nServices: Same as above.\n---\n**Colleen Quigley Women's Crisis Center**\nLocation: Price\nService Area: Carbon and Emery Counties\nPhone: (435) 637-6589 (24hr)\nServices: Same as above.\n---\n**New Horizons Crisis Center**\nLocation: Richfield\nService Area: Sevier, Millard, Piute, San Pete, and Wayne Counties\nPhone: (435) 896-9294 or 1-800-343-6302 (24hr)\nWebsite: centralutahcrisisintervention.org\nServices: Same as above.\n---\n**Seekhaven**\nLocation: Moab\nService Area: Grand County\nPhone: (435) 259-2229 (24hr)\nWebsite: seekhaven.org\nServices: Same as above.\n---\n**Canyon Creek Women's Crisis Center**\nLocation: Cedar City\nService Area: Iron, Beaver, and Garfield Counties\nPhone: (435) 233-5732 (24hr)\nWebsite: canyoncreekservices.org\nServices: Same as above.\n---\n**Dove Center**\nLocation: St. George\nService Area: Washington and Kane Counties\nPhone: (435) 628-0458 (24hr)\nWebsite: dovecenter.org\nServices: Same as above.\n---\n**Gentle Ironhawk Shelter**\nLocation: Blanding\nService Area: San Juan County\nPhone: (435) 678-0777 (24/7 Intake)\nWebsite: wearenavajo.com/the-gentle-iron-hawk-shelter/\nServices: Same as above.\n---\n**Restoring Ancestral Winds**\nService Area: Utah and the Great Basin\nPhone: 1-833-NTV-HEAL (1-833-688-4325)\nWebsite: restoringawcoalition.org\nServices: Safety planning, crisis intervention, education, advocacy, technical assistance, peer support, culturally responsive support services for domestic violence and sexual assault victims in Native communities.",

      "servicesText": "---\n**DAYTIME**\n---\n**St. Vincent De Paul Dining Hall and Weigand Resource Center Day Shelter**\n437 W. 200 S., Salt Lake City\n(801) 363-7710\nOpen 7 AM–7 PM daily (closed on holidays)\nServices: case management, storage, hygiene, showers, laundry, computer lab, clothing\nMeals (for those at/below 185% federal poverty line):\nMon–Fri: Lunch 11:30 AM–12:30 PM, Dinner 5–6 PM\nSat: Brunch 10–11 AM, Dinner 5–6 PM\nSun: Dinner 5–6 PM\n---\n**FOR WOMEN**\n---\n**Geraldine E. King Women's Resource Center** (18+ years)\n131 E. 700 S., Salt Lake City\n(801) 990-9999 (Homeless Connections Hotline for Intake)\nGo in person 7–9:30 AM to get on bed list; most vulnerable prioritized\nOpen 24/7, 365 days/year\nServices: meals, clothing, hygiene, showers, laundry, outreach team (Mon–Fri 9 AM–5 PM: 801-503-4116 or 385-421-8455)\nMeals: Breakfast 8–9 AM, Lunch 1–2 PM, Dinner 5:30–6:30 PM\n**Rescue Mission of Salt Lake Women's Center** (women and children)\n1165 S State Street, Salt Lake City\n(801) 521-5925\nOpen 365 days/year\nServices: emergency shelter, food, hygiene, clothing, work therapy, life skills, addiction recovery\n---\n**FOR YOUTH**\n---\n**Youth Resource Center – Volunteers of America** (ages 15–22)\n888 S. 400 W., Salt Lake City\n(801) 364-0744 ext. 707\nOpen 24/7; intake during drop-in hours 8:30 AM–6 PM\nServices: 3 meals/day, pantry food, showers, laundry, life-skills, housing/employment case management, dental/medical/mental health\nEmergency shelter: 7:30 PM–8:30 AM (30 beds)\n---\n**Youth Futures** (ages 12–18)\nOgden: 2760 Adams Ave., Ogden\nCedar City: 100 W. 133 S., Cedar City\nSt. George: 340 E. Tabernacle, St. George\nCall: 801-528-1214\nOpen 24/7; case management 6 AM–8 PM\nServices: overnight shelter, food, clothing, hygiene, laundry, computer, case management\n---\n**FOR MEN**\n---\n**Pamela Atkinson Men's Resource Center (single men 18+)**\n3380 S. 1000 W., South Salt Lake\n(801) 359-4142 or UCA Bed Intake Line 801-990-9999\nOpen 24/7; 300-bed shelter\nServices: 3 meals/day, showers, blankets, clothing, laundry, mail, crisis services\nRescue Mission of Salt Lake Men's Center\n463 S 400 W, Salt Lake City\n(801) 355-1302\nOpen 365 days/year\nServices: shelter, hygiene, meals, clothing, family food boxes, addiction recovery\n---\n**FOR FAMILIES**\n---\nConnie Crosby Family Resource Center (families with children)\n529 W. 9th Avenue, Midvale\n(801) 569-1201\nOpen 24/7; serves up to 300 people nightly\nServices: case management, community resources, mail\n---\n**FOR ALL**\n---\n**Lantern House** (men, women, families)\n269 W. 33rd Street, Ogden\n(801) 621-5036\nCheck-in: 6 PM–12 AM daily\nServices: shelter, transportation, mental health/addiction support, vocational support, document/ID recovery, hygiene, food boxes, clothing, 3 meals/day (Breakfast 6:30–8 AM, Lunch 12–1 PM, Dinner 5:30–7 PM), pets welcome\nIron County Care and Share (men, women, families)\n244 W. 900 N., Cedar City\n(435) 586-5142\nMeals: Breakfast 7 AM, Sack lunch, Dinner 6 PM\nServices: laundry, showers, call for shelter availability, case management if staying >3 days\n---\n**Switchpoint Tooele Community Resource Center** (men, women, families)\n251 N. 1st St. Bldg C, Tooele\n(435) 228-5151\nOpen 24/7; case management, computer, showers, food pantry, Harris Community Village (44-bed shelter, 7 family rooms, community kitchen, 66 housing units), 24/7 childcare (coming soon)\n**Switchpoint St George Community Resource Center**\n948 N. 1300 W., St. George\n",

      "servicesText": "---\n**Resources for Women who are Pregnant**\n---\n**Emergency Medicaid** (For Delivery Costs)\nUtah offers Emergency Medicaid for non-citizens (including undocumented immigrants) who meet income requirements.\nCoverage: This covers labor and delivery charges for the mother.\nEligibility: Must be a Utah resident, have low/zero income, and meet the financial criteria for regular Medicaid.\nApplication: The mother can apply one month before the expected delivery date.\nBaby's Coverage: An infant born to a mother on Emergency Medicaid is eligible for full Medicaid for their first year.\n---\n**Hospital Charity Care & Financial Assistance**\n---\n**Non-profit hospitals in Utah (such as Intermountain Health and CommonSpirit Health (Holy** ** Cross Health) are legally required to have financial assistance policies.**\nUtah Valley Hospital in Provo, American Fork Hospital, Orem Community Hospital, and Holy Cross Hospital- Mountain Point in Lehi are non-profit hospitals.\nAction: Contact the hospital's billing department immediately to apply for \"charity care\" or \"financial assistance\".\nEligibility: Generally based on income. Families with zero income likely qualify for 100% forgiveness of the bill.\nProcess: They will need to fill out an application, likely providing a letter explaining their current financial status.\nUninsured Discount: If they do not qualify for Medicaid, hospitals often offer automatic discounts for uninsured patients.\n---\n**\"Baby Your Baby\"** (For Prenatal Care)\nBaby Your Baby (BYB) is a Utah program that provides temporary Medicaid for low-income pregnant women.\nWhile BYB primarily covers outpatient prenatal care, the application process acts as a bridge to other, more comprehensive coverage.\nAction: Call the Baby Your Baby hotline at 1-800-826-9662.",

      "servicesText": "---\n**Phone and Internet Service**\n---\n**Lifeline Phone and Internet Service**\nA Federal program that provides discounted telephone service or discounted internet service through contracted service providers to low-income individuals and families.\nLifeline pays up to $9.25 towards a monthly phone, internet, or bundled service bill, or up to $34.25 per month for Tribal households.\nYou may be eligible to get Lifeline if:\nYour income is 135% or less of the federal poverty guidelines, or\nYou participate in a government assistance program such as SNAP, Medicaid, SSI, Federal public housing assistance, National School Lunch Program, or a Tribal specific program.\nHow to sign up:\nSign up at https://www.lifelinesupport.org.\nAfter you qualify, choose a phone or internet company near you and sign up for service with them.\nYou can also sign up via mail (see lifelinesupport.org), or with a participating wireless provider.\n---\n**Phone companies working with Lifeline:**\n(Some offer free service, free phones, or low-cost plans. Check online first to see if you are eligible or do the qualification process directly with one of the wireless companies.)\n* Airtalk Wireless (https://airtalkwireless.com/my-state/Utah)\n* Assurance Wireless (https://assurancewireless.com) 1-888-321-5880\n* Tru Connect (https://truconnect.com) 1-800-430-0443\n* EnTouch Wireless (https://apply4lifeline.Entouchwireless.com) 1-888-594-0579\n* Life Wireless (https://lifewireless.com) 1-888-543-3620\n* Safelink Wireless (https://safelinkwireless.com)\n* Stand Up Wireless (https://standupwireless.com) 1-800-234-9473\n---\n**Low-cost Internet Providers**\nAs low as $15/month. Based on Lifeline eligibility rules (see above). Check for availability in your area online. Applications online.\n* Xfinity \"Internet Essentials\" (https://xfinity.com/learn/internet-service/internet-essentials)\n* AT&T \"Access\" (https://att.com/access)\n* Spectrum \"Internet Assist\" (https://spectrum.com/internet/spectrum-internet-assist)\n* T-Mobile: \"Project 10 Million\" – Free Internet Access for eligible K-12 Students\nBenefits: Free mobile hotspot and Free 200GB of internet per year for 5 years.\nEligibility: K-12 students enrolled in one of the following: SNAP, Medicaid, National School Lunch Program, or Food Distribution Program on Indian Reservation.\nTo apply: Visit https://t-mobile.com/brand/project-10-million\nMust have proof of participation in one of the government programs listed above.",

      "description": "Auto repairs\nTires\nTransportation (One way ticket to verified employment or residence)\nGas card, one every six months\nAuto registrations and emissions testing \nDriver's Licensing assistance\nCall or email for an appointment",

      "lastModified": "2026-05-05T22:27:45.304Z",
      "servicesText": "The Provo office of the Salvation Army is an extension office only (they operate under the umbrella of the Denver office – they do not have any crossover capabilities with the Salt Lake Office).  They only have one part time employee at present.   \n\n**Until the Provo office can raise more funds, they are limited to providing the following services (Note – THEY DO NOT PARTICIPATE IN TANF CURRENTLY):**\n* Gas cards – limited to one $50.00 Maverick gas card every 6-months. \n* Vehicle Repairs – Contract with a mobile repair shop.  Limit of $400.00 per repair. \n* Tires – authorized to spend up to $400.00 for tire replacements. \n* Vehicle Registration – range of approximately $100.00 - $200.00 \n* Emissions testing \n* Driver’s Licenses – they will assist in obtaining a replacement driver’s license \n* Bus tickets to other cities – one-way tickets provided on the Flix (Greyhound) bus system. \n\n**Requirements for assistance:**\n* No proof of income \n* No proof of citizenship \n* If the request is vehicle related (e.g. registration or emissions testing) - they must have a valid driver’s license \n* On all vehicle items (except repairs), they will accompany the requestor at the automotive service center and pay the service provider directly. \n* To qualify for the Flix bus tickets, they will verify that the person either has 1) someone waiting for them at the destination who will provide a stable living situation (including food, shelter, clothing, etc.), or 2) proof of a valid job that the person has accepted. \n\n**If the situation is urgent, speak with Stephanie Ashcraft to reach the Salvation Army.**\n\n**Email / voicemail contact is mandated as an individual must have an appointment (since they may be out of the office assisting other individuals).**",

      "id": "8b65439aee3cb0142226d392d90fb329",
      "name": "Job Corps (Spanish)",
      "description": "Servicios proporcionados por Job Corps",
      "servicesText": "---\n**Job Corps**\n---\n¿Cuál es el próximo paso?\nDescúbralo en Job Corps.\n---\n**SUS CARRERAS COMIENZAN AQUÍ**\nAquí obtendrá un FUTURO MEJOR. Aquí obtendrá la CONFIANZA que no sabía que tenía. Aquí obtendrá la EDUCACIÓN Y ADQUIRIRÁ LAS HABILIDADES necesarias para ser exitoso. Esta es la COMUNIDAD que estuvo buscando. Aquí es DONDE COMIENZA SU CARRERA.\n**¿Sabía usted?**\n* Más de 120 centros Job Corps\n* Más de 100 programas de capacitación profesional en 10 industrias\n* MÁS DE 3 MILLONES de graduados en 59 años\n**¿La mejor parte?**\nEs completamente GRATUITO.\n\n**Esto es Job Corps.**\nPrograma educativo y de capacitación residencial para jóvenes de bajos ingresos (16–24 años). Incluye:\n* Capacitación profesional\n* Educación\n* Vivienda\n* Comidas\n* Atención médica básica\n* Asignación para gastos generales\n* Suministros/materiales\n* Licencia de conducir\n* Diploma de secundaria\n---\n**¿Cómo funciona?**\n---\n1. Inscripción abierta — comience cuando quiera\n2. Adquiera habilidades, experiencia y credenciales\n3. Obtenga su diploma o tome clases universitarias\n4. Viva en el campus y únase a un grupo estudiantil\n5. Conéctese con empleadores después de graduarse\n\nJob Corps tiene política de ***tolerancia cero** para drogas, alcohol y violencia. El proceso de solicitud requiere documentación y puede llevar tiempo.\n---\n**¿Quiénes pueden asistir?**\nDebe:\n* Cumplir requisitos de bajos ingresos\n* Tener entre 16 y 24 años\n* Ser ciudadano, residente legal o autorizado para trabajar\n* Estar dispuesto a mejorar su educación y habilidades\n\nIncluye testimonio de estudiante (Tivia).\n---\n**Capacitación práctica en 10 industrias**\n* Manufactura avanzada\n* Reparación de automóviles y maquinaria\n* Construcción\n* Finanzas y negocios\n* Atención médica\n* Seguridad nacional\n* Hotelería\n* Tecnologías de la información\n* Recursos renovables\n* Transporte\n\nMás de 100 programas disponibles.\nPre‑apprenticeships también disponibles.\n---\n**Capacitación avanzada**\nJob Corps ofrece programas avanzados en centros seleccionados, incluyendo:\n* Clearfield (Utah)\n* Earle C. Clements (Kentucky)\nInstructores ayudan a explorar opciones y requisitos.\n---\n**Vida en el recinto universitario**\nIncluye:\n* 3 comidas al día\n* Atención médica\n* Materiales de capacitación\n* Clubes y liderazgo\n* Apoyo comunitario\n\nOfrecen opciones no residenciales.\n**Explorar centros:** jobcorps.gov/explore\n**YouTube:** youtube.com/doljobcorps\n\n**Y2Y Youth 2 Youth Campaign**\nEnfoque en violencia, drogas y salud mental.\n---\n**Su fórmula para el éxito**\n1. Acomódese\n2. Comience a aprender\n3. Capacitación práctica\n4. Prepárese para el éxito\n5. Graduación\n---\n**¿Qué pasa después de Job Corps?**\nRecibirá apoyo en:\n* Búsqueda laboral\n* Vivienda y transporte\n* Currículum\n* Habilidades de entrevista\n\nJob Corps conecta con empleadores y capacita para industrias que están contratando.\nIncluye testimonio de Kasandra.\n---\n**No existe mejor momento para centrarse en su futuro**\nMás de 120 centros en EE. UU. y Puerto Rico.\nEl consejero de admisiones ayuda a completar la solicitud y elegir centro.\nIncluye mapa nacional de centros Job Corps.\n---\n**Información final**\nJob Corps es un programa del Departamento de Trabajo de EE. UU.\nNúmero TDD/TTY: (877) 889‑5627\njobcorps.gov | 800‑733‑JOBS (5627)",

      "id": "e50d81860771178643683130db27de86",

      "description": "Working with families (must have majority custody of at least 1 dependent child) who need emergency housing or eviction avoidance assistance.",
      "pdf": "assets/Boys and Girls Club - Housing (English).pdf",
      "servicesText": "**The Boys and Girls Club offers the following services:**\n* Short-term rental assistance for families – One payment made to keep them housed or to prevent eviction.\n* Housing assistance – May pay a deposit and up to 6-months of rent or partial rent.\n\n**Requirements for assistance:**\n* Must have the majority custody of at least one child under the age of 18.\n* All household members must have legal status in the U.S (TANF may be available for non-citizens with legal status approved or in place).\n* Must meet low-income eligibility, or be eligible for programs such as Medicaid, SNAP or WIC.\n* Adults must be willing and able to obtain and maintain employment.\n* For those facing eviction, they must have a Three-Day Pay or Vacate notice or an eviction notice.\n\n**Ongoing requirements for continuation of assistance:**\n* Must submit proof of income on a monthly basis. \n\n**To start the process**, scan the QR code on their flyer and submit the pre-screening form. There is also a prescreening form online at www.bgcutah.org.\n\n**Process for finding housing:**\n* Applicants must find their own housing (Boys and Girls Club has a list of potential housing units).\n* Once approved through the application process, applicants are issued a “search voucher” (proof that the Boys and Girls Club is assisting) and then have 60 days to find and secure housing.\n\nAll office personnel are bilingual—English/Spanish—or have access to translation services.",

      "id": "5f8a8a4abcd83950bf250008d3ea80c8",
      "name": "Ability 1st - Equipment Loan Progam",
      "description": "Providing durable medical equipment to disabled individuals with specific need (subject to availability).",
      "pdfs": [

          "id": "2afd7354bb0dfacd3f6b05c5590740f6",
          "name": "Ability1st Equipment Loan Program.pdf",
          "path": "pdfs/5f8a8a4abcd83950bf250008d3ea80c8/2afd7354bb0dfacd3f6b05c5590740f6-Ability1st-Equipment-Loan-Program.pdf"
        }
      ],
      "servicesText": "**Ability 1st Utah Equipment Loan Bank**\n\n* Ability 1st Utah has an equipment loan bank for durable medical equipment (DME). Most of the equipment has been donated to our center, which means that some of the equipment is gently used. Some of the devices are newly purchased from center resources. These devices are available for loan to eligible consumers.\n\n* They offer the use of durable medical equipment (DME) to our consumers on a temporary basis, until permanent equipment can be accessed and placed with the consumer.\n\n* All equipment, aside from the newly purchased items, is available on an “as is” basis. Ability 1st Utah has a limited amount of assistive equipment on loan to consumers, such as manual wheelchairs, power chairs, scooters, walkers, shower benches, and commodes. Availability of DME items is dependent on the types of items donated to Ability 1st Utah.\n\n**Specific information related to equipment loans**\n* Device Loan Period:  Loans are initially made for a 90‑day period. They can be extended to a longer period if necessary, provided there are no other requests received from different individuals with disabilities for the same device.\n* Individuals with disabilities who are interested in borrowing a device must begin the process by meeting with an independent living specialist. During this initial intake, they will complete all the required paperwork.\n* Equipment can be picked up at the center or delivered to your home.\n\n**Please contact our equipment manager.**\n* Call the main number (801‑373‑5044) and ask for the Equipment Manager.\n",

      "id": "eef7a91b2b62f0e387e8866ec7928263",
      "name": "Adult Education - Life Skills (List)",
      "description": "List of Organizations that provide education concerning life skills (financial literacy, coping with stress and anxiety, etc.), to the adult community, as well as youth and family support classes for parents.",
      "pdfs": [
        {
          "id": "ba7a0dd1276d3bc3f4ffa6928b8de351",
          "name": "Adult Education - Life Skills.pdf",
          "path": "pdfs/eef7a91b2b62f0e387e8866ec7928263/ba7a0dd1276d3bc3f4ffa6928b8de351-Adult-Education---Life-Skills.pdf"
        }
      ],
      "servicesText": "**Captain Your Story – My Story Matters**\nWebsite: mystorymatters.org\nEmail: office@mystorymatters.org\nPhone: 801‑477‑7071\n\nCaptain Your Story teaches core values and life skills. The practices and strategies are research‑based. Learning is in person with an instructor, self‑guided workbook, and mentorship.  You will benefit if you face:\n* Fear of the unknown regarding your future\n* Guilt and self‑blame for perceived failures\n* Frustration and helplessness in accessing appropriate resources and working with the system\n* Anxiety about the impact of employment on family dynamics and relationships\n* Stigma and judgment from social groups, adding to your isolation\n* Emotional exhaustion from constant worry and stress\n\nScholarships available. See QR code on flyer for application.\n---\n**Circles of Utah County**\nEmail: kiraw@casfb.org\nPhone: 801‑866‑1553\n\nCircles is a national initiative that works with local individuals and families to achieve financial stability. Participants:\n* Attend a 12‑week class learning life skills and making a plan to reach financial stability\n* Meet once a week to eat dinner, learn, and work on their self‑reliance plans\n\nDinner and childcare are provided.\nAfter completing the class, they are assigned 1‑3 long‑term volunteers who offer support and advice\n\nTo sign up, use the email or phone listed above. Space is limited.\n---\n**Community Action Services and Food Bank – Financial Literacy Classes**\nWebsite: communityactionuc.org\nEmail: info@communityactionuc.org\nPhone: 801‑373‑8200\n\nFree financial literacy classes for individuals and families in Utah County. Topics include:\n* Budgeting and saving\n* Credit scores and debt management\n* Smart spending and goal setting\n* Building financial confidence\n\nClasses are offered in English and Spanish. Childcare and refreshments provided. Registration required via website or email.\n---\n**United Way Utah County Digital Skills**\nAddress: 148 North 100 West, Provo, UT 84601 \nPhone: 801-374-2588 \nHours: Monday – Friday 8:30 am – 5:00 pm \n\n**Offers two computer classes:**\n* Basic computer skills that focus on Google tools, internet safety, and basic computer use. \n* Intermediate class covers topics such as Excel/Google sheets use, cybersecurity, writing resumes and cover letters, creating a LinkedIn, and looking for jobs online. \n\nGraduates receive a donated computer.  \nClasses are free. \nFor more information, go to their website unitedwayuc.org/our-work/everyday-support/digital-literacy/ and click on “Register for a Class”. \n---\n**Federal TRIO Programs**\n\nTRIO are special programs funded by the government to help people who might face challenges in education. \nTRIO focuses on 3 main groups: \n* Low-income individuals. \n* First-generation college students. \n* Individuals with disabilities. \nAcross all TRIO programs, students can receive guidance and mentoring from middle school through graduate programs. \n\nStudents must meet eligibility requirements, apply for participation, and live within the service region of their program. \n\nFor more information, go to: www.uvu.edu/trio/ \n\n ",

      "servicesText": "Provides a way to receive immediate cash for plasma donations.  Payment for each clinic is different and depends on the frequency of donations.  Each payment is made via a plasma center issued debit card.   \n\n**BioLife Services: (www.biolifeplasma.com) **\n\n**Requirements to donate:**\n* Current form of ID (e.g. driver’s license) \n* Social Security Number (e.g. social security card, W-2, Pay stub) \n* At least 18 years old \n* In good health \n* Requires a health screen before each donation \n* Donor must live within a 40-mile radius of the donation center and must have proof of a permanent local address \n\n**Orem Location: **\n168 E. University Parkway, Orem, UT \n385-881-0353 \n\n**American Fork Location: **\n632 N. 900 W., American Fork, UT \n801-763-0050 \n--- \n**Grifols (Talecris) Plasma Resources: (www.grifolsplasma.com)** \n\n**Requirements to donate:**\n* Valid photo ID (e.g. driver's license) \n* Proof of Social Security number (e.g. social security card, W-2, Pay stub) \n* Proof of permanent physical residential address \n* Current State ID (e.g. driver’s license) \n* At least 18 years old \n* At least 110 pounds \n\n**Provo Location (Telecris):**\n651 W. Columbia Lane, Provo, UT \n801-377-1243 \n\n**Provo Location (Grifols Biomat):**\n501 N. 900 E. \n801-375-2279 \n\n**Orem Location (Grifols Biomat):**\n349 E. University Parkway, Orem, UTY \n801-235-9800 \n\n**Spanish Fork Location (Grifols Biomat):**\n450 N. Main Street, Spanish Fork, UT \n801-798-7451 ",

          "path": "pdfs/83cef4c7ca6a62e9bf4ab6d694f78bd9/86cc7064d1e7348c0931b60868f1c851-Commodity-Supplemental-Food-Program.pdf"
        }
      ],
      "servicesText": "**Commodity Supplemental Food Program**\nGeneral Resource Guides - Aging, Senior Citizens\nVerified April 2026\n\n**Utah Food Bank**\nAddress: 1900 W 900 S, Springville, UT 84663\nPhone: 801-887-1277\nHours: Monday-Friday 8am-5pm\nWebsite: www.utahfoodbank.org/csfp\n\nPopulation served: Seniors age 60 and older.\n\n**Services offered**\n* Free monthly package containing 10 days' worth of USDA nutrient-rich food valued at $55.\n* Nutrition education.\n* Recipes specific to the supplied food to help maximize the number of meals made from the box.\n* Example box items: canned meat, peanut butter, cheese, fruit, dried beans, vegetables, shelf-stable milk, chili, rice, breakfast cereal, and pasta.\n* Packages must be picked up each month at a designated site by the person or a designated proxy. Call 801-887-1264.\n\n**Eligibility requirements**\n* Reside in Utah.\n* Be 60 years of age or older.\n* Have income at or below 150% of federal poverty guidelines.\n\n**Income examples (April 2026)**\n* Household size 1: $1,995 gross monthly income.\n* Household size 2: $2,705 gross monthly income.\n* Household size 3: $3,415 gross monthly income.\n* Household size 4: $4,125 gross monthly income.\n* Each additional member adds $710 to monthly income.\n\nApply online at www.utahfoodbank.org/csfp or call 801-887-1275.\n\nLanguages available: online application in English, Spanish, Russian, and Bosnian.",

      "id": "352eb4e8ee6d547ad92a6c80ec1fedcc",
      "name": "Dental Services (List)",
      "description": "List of free or low-cost Dental Services ",
      "pdfs": [
        {
          "id": "7b8b2bea65d95180a27c87920825dc65",
          "name": "Dental Services (List).pdf",
          "path": "pdfs/352eb4e8ee6d547ad92a6c80ec1fedcc/7b8b2bea65d95180a27c87920825dc65-Dental-Services-List-.pdf"
        }
      ],
      "servicesText": "**Free and Low-Cost Dental Services**\nGeneral Resource Guides - Dental\nVerified April 2026\n---\n**UVU Dental Hygiene Program**\nProvides inexpensive basic dental care: cleaning, x-rays, and exams. Students are the primary practitioners, supervised by trained professionals. Preventative care only; no dental work. Appointments last at least 3 hours. Call for appointment.\n\n**Cost for cleaning, x-rays, and exams**\n* Adults: $25\n* Children: $15\n* UVU students: $15\n\n**Additional services**\n* Panoramic film: $10\n* Full mouth x-rays: $10\n* Sealants: $5/tooth\n* Nitrous oxide: $10\n* Bleaching trays: $40\n\nLocation: 2889 Ashton Blvd., Lehi, UT, UVU 2 Room 201\nPhone: 801-863-7608\nHours: open Spring (January-April) and Fall (August-December) semesters only. See website for days, hours, and forms.\n---\n**Half Price Dental**\nProvides professional dental services at about half the cost of the national average. Call for prices and appointment.\n\nWebsite: www.halfpricedentalclinic.com\nAddress: 1176 S 1480 W, Orem, UT 84058\nPhone: 801-426-0774\nHours: Monday-Thursday 8am-5pm\n---\n**Bingham Family Clinic**\nProvides high quality medical and dental services at no cost to uninsured individuals and families in Utah County who earn less than 300% of the Federal Poverty Level. Staffed by volunteer providers and support staff. Can communicate in 23 languages. Appointments available by phone or walk-in.\n\nAddress: 987 South Geneva Rd., Orem, UT 84058 (north side of building on UVU west campus, next to the National Guard site)\nPhone: 801-854-5168\nEmail: info@binghamfamilyclinic.org\nHours: Monday-Friday 10:00am-6:00pm\n\n**Services provided**\n* Dental care\n* Primary care for all ages\n* Routine check-ups and preventative care\n* Common illnesses\n* Diabetic care\n* Acute care (non-emergency room)\n* Specialty care by appointment only\n* Mental health\n* Lab services\n* On-site pharmacy\n* Educational classes\n* Community resource referrals\n* X-rays on site\n---\n**Mountainlands Community Health Clinic**\nProvides low-income, uninsured, and under-insured individuals with high quality health care.\n\n**Services include**\n* Wellness exams, same day sick clinics, women's health exams, family planning, senior health services, sports physicals, and more.\n* Dental services in Provo, Payson, and East Bay sites. For more information, call 801-429-2013.\n* To become a patient, call 801-429-2000. They will ask a few short questions and schedule an appointment.\n* If insured, bring insurance card. They accept most plans including Medicaid.\n* If uninsured, provide proof of income to qualify for the sliding fee scale.\n\n**Provo Family Health Center**\n589 S State St.\nProvo, UT 84606\nPhone: 801-429-2000\nMedical and Mental Health: Monday-Thursday 8:00am-7:00pm, Friday 8:00am-5:00pm, Saturday 8:00am-1:30pm medical only. Mental Health by appointment only on Saturday.\nDental: 801-429-2013, Monday-Friday 8:00am-5:00pm\nPharmacy: 801-429-2020\n\n**East Bay Health Center**\nFood and Care Coalition building\n299 E 900 S Ste 101\nProvo, UT 84606\nPhone: 801-429-2000\nMedical: Monday-Friday 8:30am-5:00pm\nDental: Thursday 9:00am-5:00pm\n\n**Payson Family Health Center**\n285 N 1250 E Ste 103\nPayson, UT 84651\nPhone: 801-429-2000\nMedical: Monday-Friday 8:30am-5:00pm\nMental Health: Monday, Tuesday, Friday 9:00am-5:00pm\nDental: Friday 8:00am-5:00pm\nPharmacy: Monday-Friday 9:00am-6:00pm\n---\n**Dental Lifeline Network** (www.dentallifeline.org/utah/)\nApplicants must have no means to afford dental care and must meet one of the following criteria:\n* Over 65 years of age\n* Permanently disabled\n* Need medically necessary dental care\n\nVolunteers provide treatment to eligible patients. Volunteers do not provide emergency or cosmetic services. If you have documentation from a physician stating you cannot receive essential medical treatment due to your dental condition, apply even if your county is closed. Veterans may also apply if they meet the qualifications. Apply online.\n---\n**Utah College of Dental Hygiene**\n1176 S 1480 W\nOrem, UT 84058\nPhone: 801-426-8234\nHours: Monday-Thursday 8:00am-5:00pm, Friday 9:00am-1:00pm\n\nDental cleanings are done by supervised dental hygiene students. Call for appointments and cost.\n---\n**University of Utah School of Dentistry** (Salt Lake City)\nCall 801-587-6453 or visit healthcare.utah.edu/dentistry.\n\nThey offer a full range of services. If you do not have dental insurance or want to pay out-of-pocket, you can see a dental resident or dental student at a reduced price.\n* Faculty dentists charge full market rate.\n* Resident dentists offer 25-30 percent off most services for self-pay patients.\n* Student dentists offer 30-50 percent off most services compared to full market rates for self-pay patients.\n---\n**Dental Care for Eligible Medicaid Patients**\nDental care is a covered service for Medicaid members. For assistance finding a dentist, call a Medicaid Health Program Representative at 1-866-608-9422. Free language services are available. If you need a ride, free transportation may be available through Non-Emergency Medical Transportation.\n\n**Benefits include**\n* Check-ups, x-rays, and cleanings every six months\n* Tooth colored fillings for front teeth\n* Silver fillings for back teeth\n* Root canal treatment for certain teeth\n* Removal of the soft inner part of infected baby teeth\n* Pulling teeth\n* Dentures and partial dentures\n* Space maintainers for children with missing teeth\n* Some orthodontic care for children\n* Some specialty care for surgical centers for care under general anesthesia\n* Emergency exams for acute onset of pain\n* Crowns for certain populations\n---\n**Orthodontic Services**\n\n**Smile for A Lifetime**\nWebsite: smileforalifetime.org\nA nationwide program that provides orthodontic treatment to children ages 8 to 18 who may not have the means to afford care. Application process begins with a $20 fee. After review and assignment to a participating orthodontist, a final payment of $480 will be charged. See website for qualifications and approval process.\n\n**Gifted Smiles**\nA program of the American Association of Orthodontists Foundation that provides necessary orthodontic treatments to children of families who lack access to care.\nWebsite: www.aaoinfo.org/treatments/gifted-smiles/\n\nEligibility requirements:\n* Child is 18 years old or younger.\n* Total family income is 200% of the poverty level or less.\n* Child receives regular dental care and has good oral hygiene.\n* Child is not currently in orthodontic treatment or between phases of treatment.\n* Child has not received previous orthodontic treatment.",
      "tags": [
        "List"
      ],
      "verifiedOn": "05/26",
      "phone": "",
      "address": "",

      "servicesText": "**Timpanogos Legal Center **\nPhone:  801-649-8895 \nEmail:  TLCinfo@timplegal.org \nHours:  Monday through Friday 9:00 am – 2:00 pm \n\n**Eligibility: **\n* Individuals who need legal advice as a result of being a victim of abuse, or who have children that are victims of abuse. \n* Individuals who have income that is less than 200% of the federal poverty level. \n* Cases must be located in Utah\n\n**Services: **\n* Free Legal Advice Hotline \n* Advise on family law, protective orders, housing law and guardianships. \n---\n**Legal Advice Clinics **\nUtah County Health and Justice Building \n151 South University Ave., Provo, UT \nHours: Tuesday 5:00 pm – 8:00 pm \n\n* Clients are seen on a first-come, first-served basis (no appointment is necessary) \n* Individuals MUST be representing themselves in court; \n* The individual must be pre-screened. \n* Immigration law attorneys are available the 1st and 3rd Tuesday of each month \n* Document clinic is available \n* Meet with an attorney either by phone or online to draft family law court documents.  \n**NOTE:  The Legal Center does not provide in-court representation. **\n---\n**Utah Legal Services**\nPhone:  801-328-8891 \nHours:  Monday – Friday 9:00 am – 2:00 pm \nWebsite (to apply on-line):  utahlegalservices.org \n\nProvides free legal assistance to low-income Utahns involved in non-criminal cases throughout Utah. \n \nIf you have an appointment, Provo information is: \nPhone:  801-374-6766 \nAddress:  455 N. University Ave., Suite 100, Provo, UT  84601 \nFree Legal Advice Hotline \n\n**Eligibility:**\n* Must be a citizen or legal permanent resident, unless the case is a result of domestic violence. \n* Individuals must have income that is less than 200% of the federal poverty level. \n* Type of case – must be within the scope of services they perform. \n\n**Services:**\n* Domestic Violence Lease Termination\n* Stalking injunctions\n* Dating violence protective orders\n* Cohabitant abuse protective orders\n* Powers of Attorney\n* Guardianship & Conservatorship\n* Custody\n* Adoption\n* Divorce\n* Annulment\n* Marriage  \n* Housing Eviction Basics \n---\n**BYU Community Legal Clinic**\nAddress:  Wilkinson Center #2400, 1060 East Campus Drive, Provo, Utah \nHours:  Thursdays 5:00pm – 7:00pm \nAppointment: communitylegalclinic@law.byu.edu \n\n**Services:**\n* Free legal services to those in need. \n* Matters including immigration, contracts, consumer law, government benefits, and landlord/tenant issues. \n--- \n**Utah County Family Justice Center**\nPhone:  801-851-8554 \nAddress:  Utah County Health and Justice Building, 151 South University Avenue, Room 1601, Provo \nHours:  Tuesday Evenings 5:00pm - 8:00pm   \n\nEnabling victims of crime (domestic violence, child abuse, sexual assault, etc.) to seek safety, healing and self-sufficiency by improving timely access to essential community services, providing crisis intervention and support, educating victims about choices, and facilitating necessary legal intervention. \n\n**Eligibility:**\n* Family and Legal Tenant law is available to those under 200% of the Federal Poverty Guideline. \n* Clinic operates on a first-come-first-served basis. \n \n**Services:**\n* Free one-stop clinic providing legal advice on family, elder and tenant law only \n* Immigrant legal services are available on the 1st, 2nd and 3rd Thursday only \n* 1st Tuesday includes Division of Child and Family Services, Wasatch Mental Health and assistance with medical insurance.   \n---\n**Disability Law Center**\nPhone:  800-662-9080 \nAddress:  960 South Main Street, Salt Lake City, UT \nWeb site:  disabilitylawcenter.org/get-help/apply-for-help \nHours:  Messages left will be answered in 1-3 business days \n\nFree services to advocate for persons with disabilities. \n\n**Services:**\n* Provide assistance in the following areas: \n* Accessibility \n* Community living \n* Education \n* Employment \n* Housing \n* Vocational Rehab \n* Institutional rights (extended care facilities) \n* Self-determination and alternatives to guardianship \n",

      "servicesText": "**Small Business Development Center (Utah Valley University)**\n815 West 1250 South \nOrem, UT \n801-863-8230 \nSbdc@uvu.edu \nMonday – Friday 9:00 am – 5:00 pm \n\n* Business Advising, classes, monthly workshops and clinics. \n* Business Plans \n* Start-up assistance \n* Management & leadership \n* Finance and capital \n* Marketing and sales \n* Customer relations \n* Business accounting and budgeting \n* Cash flow management \n* Tax planning \n* Government contracting \n* Franchising\n* Buying and selling a business \n* ECommerce \n* International trade \n---\n**Women’s Business Center of Utah **\nWomen’s Business Center of Utah-Northern \n201 S Main, Suite #2300 \nSalt Lake City, UT 84111 \nPhone: 801-328-5066 \nWebsite: www.wbcutah.org \nEmail: www.wbcutah.org/contact \n\nThey help Utah women build confidence, create opportunities, and experience success in business ownership. No matter where you are in your business journey, they will help you move forward. \nComplete a one-time signup form at www.wbcutah.ecenterdirect.com/ \nThen sign up for services. \n\n* Free virtual business advising sessions.  \n* Free mentorship and business coaching. \n\nWBCUtah does not provide loans or grants but will help you navigate funding. \n---\n**iHUB Utah**\n\niHubUtah is a nonprofit organization that focusses on **supporting early-stage start-ups and young entrepreneurs** primarily in Utah County. \nFree resources including office space, mentorship, and networking opportunities. \nFor more information and to apply, go to: www.ihubutah.org/apply \n---\n**Payson Utah Business Innovation Center**\n993 South 1950 West \nPayson, UT \n385-895-8414 \nInnovationcenter@paysonutah.gov \nMonday – Friday 8:00 am – 8:00 pm \n\n* Workspaces \n* Prototypes \n* Business Mentoring \n* Workshops and events \n\n**NOTE:  This is a subscription based innovation center and not applicable to those who do not have funding.**\n\n \n\n ",

    {
      "id": "f23c9fea1721099eacb74dcac68e4b31",
      "name": "Disability Services - Utah County",
      "description": "List of service providers who assist with those who have disabilities",
      "pdfs": [
        {
          "id": "4bde25ceb7ff3ad678b432b5171398e1",
          "name": "Disability Services - Utah County.pdf",
          "path": "pdfs/f23c9fea1721099eacb74dcac68e4b31/4bde25ceb7ff3ad678b432b5171398e1-Disability-Services---Utah-County.pdf"
        }
