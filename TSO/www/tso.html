      "servicesText": "**Disability Services - Utah County**\nGeneral Resource Guides - Housing\nVerified February 2026\n---\n**Ability 1st Utah**\nAddress:\n1455 West 820 North\nProvo, UT 84601\nPhone: 801-373-5044\nHours:\n* Monday-Thursday 7:30am-4:30pm\n* Friday 7:30am-1:30pm\nWebsite: www.ability1stutah.org\n\nPopulation served: individuals of any age with disabilities, including physical, mental, developmental, cognitive, sensory, and other disabilities.\n\n**Services offered**\n* Transportation to access community resources\n* Independent living classes\n* Assistance applying for programs including Medicare, Medicaid, SSI advocacy, SNAP, DI vouchers, and citizenship\n* Food assistance and home delivered meals\n* Applications for Utah County Housing Authority, Section 8 housing, HEAT, and weatherization programs\n\nEligibility requirements: no proof of disability is required.\nLanguages available: Spanish and English.\n---\n**Ability 1st Utah - Equipment Loan Program**\nAddress:\n1455 West 820 North\nProvo, UT 84601\nPhone: 801-373-5044\nHours:\n* Monday-Thursday 7:30am-4:30pm\n* Friday 7:30am-1:30pm\nWebsite: www.ability1stutah.org\nEquipment manager: Robert Jordan, 801-850-5568\n\nPopulation served: individuals with specific durable equipment needs.\n\nServices offered: loans of durable equipment, based on availability, for up to a 90-day period.\nEligibility requirements: individuals must work with a case manager and have an evaluation.\nLanguages available: Spanish and English.\n---\n**Advocates for Independence**\nCase management company dedicated to helping people transition into independent living. The New Choices Waiver primarily helps people move from skilled nursing facilities to the living situation of their choice, with services that meet their needs.\n\nAddress: 323 N. Main St., Tooele, UT 84074\nPhone: 801-679-6461\nHours: Monday-Friday 8:00am-5:00pm\nWebsite: www.advocatesforindependence.com\nPopulation served: elderly and disabled persons.\n\n* function nowISO(){ return new Date().toISOString(); }
function escapeHTML(str){ return (str||"").replace(/[&<>"']/g, m=>({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;" }[m])); }
function normalizeWebsiteURL(url){
  const trimmed = typeof url === "string" ? url.trim() : "";
  if(!trimmed) return "";
  if(/^https?:\/\//i.test(trimmed)) return trimmed;
  return `https://${trimmed}`;
}
function generateResourceId(){
  const bytes = new Uint8Array(16);
  crypto.getRandomValues(bytes);
  return Array.from(bytes)
    .map(b => b.toString(16).padStart(2,"0"))
    .join("");
}

function filenameFromPath(path){
  const clean = String(path || "").split(/[?#]/)[0];
  return clean.split("/").filter(Boolean).pop() || "";
}

function safePDFFileName(name){
  const fallback = "attachment.pdf";
  const base = filenameFromPath(name) || fallback;
  const safe = base.replace(/[^A-Za-z0-9._-]+/g, "-").replace(/^-+|-+$/g, "") || fallback;
  return /\.pdf$/i.test(safe) ? safe : `${safe}.pdf`;
}

function stablePDFIdFromPath(path, fallback = "pdf"){
  const text = String(path || fallback);
  let hash = 2166136261;
  for(let i = 0; i < text.length; i += 1){
    hash ^= text.charCodeAt(i);
    hash = Math.imul(hash, 16777619);
  }
  return `pdf-${(hash >>> 0).toString(16)}`;
}

function pdfNameFromPath(path){
  return filenameFromPath(path) || "PDF";
}

function buildPDFStoragePath(resourceId, attachmentId, fileName){
  return `pdfs/${encodeURIComponent(resourceId || "resource")}/${attachmentId}-${safePDFFileName(fileName)}`;
}

function showToast(message, options = {}){
  let toast = document.getElementById("appToast");
  if(!toast){
    toast = document.createElement("div");
    toast.id = "appToast";
    toast.className = "app-toast hidden";
    toast.setAttribute("role", "status");
    toast.setAttribute("aria-live", "polite");
    document.body.appendChild(toast);
  }
  toast.textContent = message;
  toast.classList.toggle("important", !!options.important);
  toast.classList.remove("hidden");
  if(showToast.timer) clearTimeout(showToast.timer);
  if(options.sticky){
    showToast.timer = null;
  }else{
    showToast.timer = setTimeout(() => {
      toast.classList.add("hidden");
      toast.classList.remove("important");
    }, 4500);
  }
}

// ============================================================
// DATA NORMALIZATION
// ============================================================
// Normalize legacy/imported records into a single canonical shape so rendering,
// editing, and persistence logic only handle one schema.

function normalizeResourceServices(r){
  // Canonical: servicesText string. Legacy: services array of lines.
  if(!r || typeof r !== "object") return false;
  if(typeof r.servicesText === "string"){
    delete r.services;
    return false;
  }
  if(Array.isArray(r.services)){
    r.servicesText = r.services.join("\n");
    delete r.services;
    return true;
  }
  if(!r.servicesText) r.servicesText = "";
  return false;
}

function normalizeResourceVerifiedOn(r){
  // Canonical: verifiedOn in MM/YY (or null). Legacy aliases are consumed then removed.
  if(!r || typeof r !== "object") return;
  const preferred = coerceVerifiedOnToMMYY(r.verifiedOn);
  if(preferred){
    r.verifiedOn = preferred;
  }else{
    const legacyReviewed = coerceVerifiedOnToMMYY(r.reviewedOn);
    const legacyVerifiedDate = coerceVerifiedOnToMMYY(r.verifiedDate);
    r.verifiedOn = legacyReviewed || legacyVerifiedDate || null;
  }
  if("reviewedOn" in r) delete r.reviewedOn;
  if("verifiedDate" in r) delete r.verifiedDate;
}

function normalizeResourcePDFs(r){
  // Canonical: pdfs array of { id, name, path }. Legacy pdf path is preserved.
  if(!r || typeof r !== "object") return;
  const attachments = [];
  const seenPaths = new Set();

  if(Array.isArray(r.pdfs)){
    r.pdfs.forEach((pdf, index) => {
      if(!pdf || typeof pdf !== "object") return;
      const path = typeof pdf.path === "string" ? pdf.path.trim() : "";
      if(!path || seenPaths.has(path)) return;
      seenPaths.add(path);
      const id = String(pdf.id || "").trim() || stablePDFIdFromPath(`${path}:${index}`);
      attachments.push({
        id,
        name: String(pdf.name || pdfNameFromPath(path)).trim() || "PDF",
        path
      });
    });
  }

  const legacyPath = typeof r.pdf === "string" ? r.pdf.trim() : "";
  if(legacyPath && !seenPaths.has(legacyPath)){
    attachments.push({
      id: stablePDFIdFromPath(legacyPath),
      name: pdfNameFromPath(legacyPath),
      path: legacyPath
    });
  }

  r.pdfs = attachments;
  if(typeof r.pdf !== "string" && "pdf" in r) delete r.pdf;
}

function normalizeDataServicesShape(data){
  if(!data.resources) return;
  data.resources.forEach(normalizeResourceServices);
}

function normalizeDataPDFShape(nextData){
  if(!nextData || !Array.isArray(nextData.resources)) return;
  nextData.resources.forEach(normalizeResourcePDFs);
}

function normalizeDataVerifiedOnShape(nextData){
  if(!nextData || !Array.isArray(nextData.resources)) return;
  nextData.resources.forEach(normalizeResourceVerifiedOn);
}

function formatMMYYFromDate(d){
  const mm = String(d.getMonth()+1).padStart(2,"0");
  const yy = String(d.getFullYear()).slice(-2);
  return `${mm}/${yy}`;
}

function formatDateOnly(isoString){
  if(!isoString) return "(none)";
  const date = new Date(isoString);
  if(Number.isNaN(date.getTime())) return String(isoString);
  return date.toLocaleDateString(undefined, { year:"numeric", month:"long", day:"numeric" });
}

function formatDateTimeUTC(isoString){
  if(!isoString) return "(none)";
  const date = new Date(isoString);
  if(Number.isNaN(date.getTime())) return String(isoString);
  const month = date.toLocaleString(undefined, { month:"long", timeZone:"UTC" });
  const day = date.getUTCDate();
  const year = date.getUTCFullYear();
  const hour = date.getUTCHours();
  const minute = String(date.getUTCMinutes()).padStart(2, "0");
  return `${month} ${day}, ${year}, ${hour}:${minute} UTC`;
}

function parseMMYYToMonthIndex(mmyy){
  const match = String(mmyy || "").trim().match(/^(0[1-9]|1[0-2])\/(\d{2})$/);
  if(!match) return null;
  const month = Number(match[1]);
  const yy = Number(match[2]);
  const year = 2000 + yy;
  return year * 12 + (month - 1);
}

function isValidMMYY(value){
  return parseMMYYToMonthIndex(value) !== null;
}

function formatVerifiedOnForDisplay(verifiedOn){
  return isValidMMYY(verifiedOn) ? String(verifiedOn).trim() : "----";
}

function parseLegacyVerifiedOnToMMYY(raw){
  const text = String(raw || "").trim();
  if(!text) return null;

  const mmyy = text.match(/^(\d{1,2})[\/\-](\d{2})$/);
  if(mmyy){
    const month = Number(mmyy[1]);
    const yy = Number(mmyy[2]);
    if(month >= 1 && month <= 12) return `${String(month).padStart(2,"0")}/${String(yy).padStart(2,"0")}`;
  }

  const withYear = text.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2}|\d{4})$/);
  if(withYear){
    const month = Number(withYear[1]);
    const yearRaw = withYear[3];
    if(month >= 1 && month <= 12){
      const yy = yearRaw.length === 4 ? Number(yearRaw.slice(-2)) : Number(yearRaw);
      return `${String(month).padStart(2,"0")}/${String(yy).padStart(2,"0")}`;
    }
  }

  const compact = text.match(/^(\d{2})(\d{2})(\d{2})$/);
  if(compact){
    const month = Number(compact[1]);
    const yy = Number(compact[3]);
    if(month >= 1 && month <= 12) return `${compact[1]}/${String(yy).padStart(2,"0")}`;
  }

  if(/^\d{4}-\d{2}-\d{2}$/.test(text)){
    const isoDate = new Date(`${text}T00:00:00`);
    if(!Number.isNaN(isoDate.getTime())) return formatMMYYFromDate(isoDate);
  }

  const parsed = new Date(text);
  if(!Number.isNaN(parsed.getTime())) return formatMMYYFromDate(parsed);
  return null;
}

function coerceVerifiedOnToMMYY(value){
  if(value == null) return null;
  const text = String(value).trim();
  if(!text) return null;
  if(isValidMMYY(text)) return text;
  const parsed = parseLegacyVerifiedOnToMMYY(text);
  return parsed && isValidMMYY(parsed) ? parsed : null;
}

function validateVerifiedOnInput(value){
  const text = String(value || "").trim();
  if(!text) return { valid:true, normalized:null, message:"" };
  if(!isValidMMYY(text)){
    return { valid:false, normalized:null, message:"Use MM/YY (MM 01-12)." };
  }
  return { valid:true, normalized:text, message:"" };
}

function compareResourcesByName(a, b){
  return String((a && a.name) || "").localeCompare(String((b && b.name) || ""), undefined, { sensitivity:"base" });
}

function getAdminResourceBrowseList(){
  const resources = data.resources.slice();
  if(!adminShowVerifiedDates){
    return resources.sort(compareResourcesByName);
  }
  return resources.sort((a, b) => {
    const aMonth = parseMMYYToMonthIndex(a.verifiedOn);
    const bMonth = parseMMYYToMonthIndex(b.verifiedOn);
    const aVerified = aMonth !== null;
    const bVerified = bMonth !== null;
    if(aVerified !== bVerified) return aVerified ? -1 : 1;
    if(aVerified && bVerified && aMonth !== bMonth) return aMonth - bMonth;
    return compareResourcesByName(a, b);
  });
}

function buildAdminDeleteConfirmation(kind, name){
  if(kind === "resource"){
    return [
      `Are you sure you want to delete the resource '${name}'?`,
      "",
      "This removes it from all categories and Favorites.",
      "Undo will be available in Admin to restore what you deleted."
    ].join("\n");
  }
  if(kind === "category"){
    return [
      `Are you sure you want to delete the category '${name}'?`,
      "",
      "Resources are not deleted, but they will no longer appear under this category.",
      "Undo will be available in Admin to restore what you deleted."
    ].join("\n");
  }
  return "Are you sure?";
}

function canonicalizeResourceTag(tag){
  const trimmed = String(tag || "").trim();
  const key = trimmed.toLowerCase();
  if(
    key === "this resource is a list" ||
    key === "this is a list" ||
    key === "list resource"
  ){
    return "List";
  }
  return trimmed;
}

function normalizeResourceTags(tags){
  const normalized = [];
  const seen = new Set();
  const source = Array.isArray(tags)
    ? tags
    : (typeof tags === "string" ? tags.split(/[,\n]/) : []);

  source.forEach(rawTag => {
    if(typeof rawTag !== "string" && typeof rawTag !== "number") return;
    const tag = canonicalizeResourceTag(rawTag);
    if(!tag) return;
    const key = tag.toLowerCase();
    if(seen.has(key)) return;
    seen.add(key);
    normalized.push(tag);
  });
  return normalized;
}

function parseResourceTagsInput(value){
  return normalizeResourceTags(String(value || "").split(/[,\n]/));
}

function formatResourceTagsInput(tags){
  return normalizeResourceTags(tags).join("\n");
}

function toggleResourceTag(tags, tag){
  const currentTags = normalizeResourceTags(tags);
  const normalizedTag = normalizeResourceTags([tag])[0];
  if(!normalizedTag) return currentTags;
  const key = normalizedTag.toLowerCase();
  if(currentTags.some(current => current.toLowerCase() === key)){
    return currentTags.filter(current => current.toLowerCase() !== key);
  }
  return normalizeResourceTags([...currentTags, normalizedTag]);
}

function normalizeDataTagsShape(nextData){
  if(!nextData || typeof nextData !== "object") return;
  if(!Array.isArray(nextData.tags)) nextData.tags = [];
  nextData.tags = [];

  if(!Array.isArray(nextData.resources)) return;
  nextData.resources.forEach(r => {
    r.tags = normalizeResourceTags(r.tags);
  });
}

function getAllTags(excludeResourceId = ""){
  const tags = [];
  const seen = new Set();
  (Array.isArray(data.resources) ? data.resources : []).forEach(resource => {
    if(excludeResourceId && String(resource && resource.id || "") === String(excludeResourceId)) return;
    normalizeResourceTags(resource && resource.tags).forEach(tag => {
      const key = tag.toLowerCase();
      if(seen.has(key)) return;
      seen.add(key);
      tags.push(tag);
    });
  });
  return tags.sort((a,b)=>a.localeCompare(b, undefined, { sensitivity:"base" }));
}

const TAG_CATEGORY_HINTS = [
  {
    categoryLabel: "Housing",
    tags: ["Shelter", "Rental", "Subsidized Housing", "Eviction Help", "Hotel/Motel", "Room for Rent", "Rent/Mortgage Assistance"]
  },
  {
    categoryLabel: "Employment",
    tags: ["Temp Agency", "Employment Agency", "Employment Counseling", "Career/Vocational Training", "Apprenticeship", "Ex-Offender Support"]
  },
  {
    categoryLabel: "Education",
    tags: ["Career/Vocational Training", "GED", "Scholarships", "Apprenticeship"]
  }
];

function getSuggestedCategoriesFromTags(tags){
  const tagKeys = new Set(normalizeResourceTags(tags).map(tag => tag.toLowerCase()));
  return TAG_CATEGORY_HINTS
    .filter(hint => hint.tags.some(tag => tagKeys.has(canonicalizeResourceTag(tag).toLowerCase())))
    .map(hint => hint.categoryLabel);
}

function findCategoryByLabelOrId(label){
  const key = String(label || "").trim().toLowerCase();
  return (Array.isArray(data.categories) ? data.categories : [])
    .find(cat => String(cat && cat.label || "").trim().toLowerCase() === key || String(cat && cat.id || "").trim().toLowerCase() === key);
}

function getMissingSuggestedCategories(draft){
  const selected = new Set(Array.isArray(draft && draft.categories) ? draft.categories.map(String) : []);
  return getSuggestedCategoriesFromTags(draft && draft.tags)
    .filter(label => {
      const category = findCategoryByLabelOrId(label);
      return category && !selected.has(String(category.id || ""));
    });
}

function formatCategoryList(labels){
  if(labels.length <= 1) return labels[0] || "";
  if(labels.length === 2) return `${labels[0]} and ${labels[1]}`;
  return `${labels.slice(0, -1).join(", ")}, and ${labels[labels.length - 1]}`;
}

function confirmCategoryAssignmentHint(draft){
  const missing = getMissingSuggestedCategories(draft);
  if(!missing.length) return true;
  const categoryList = formatCategoryList(missing);
  const categoryPhrase = missing.length === 1 ? "that category is" : "those categories are";
  return confirm(`This resource has tags suggesting ${categoryList}, but ${categoryPhrase} not selected. Continue?`);
}

function getResourcePDFs(resource){
  normalizeResourcePDFs(resource);
  return Array.isArray(resource.pdfs) ? resource.pdfs : [];
}

function collectPDFPathsFromResource(resource, { includeLegacy = true } = {}){
  if(!resource || typeof resource !== "object") return [];
  const paths = [];
  const seen = new Set();
  getResourcePDFs(resource).forEach(pdf => {
    const path = typeof pdf.path === "string" ? pdf.path.trim() : "";
    if(!path || seen.has(path)) return;
    seen.add(path);
    paths.push(path);
  });
  if(includeLegacy && typeof resource.pdf === "string"){
    const legacyPath = resource.pdf.trim();
    if(legacyPath && !seen.has(legacyPath)) paths.push(legacyPath);
  }
  return paths;
}

function collectPDFPathsFromResources(resources){
  const paths = [];
  const seen = new Set();
  (Array.isArray(resources) ? resources : []).forEach(resource => {
    collectPDFPathsFromResource(resource).forEach(path => {
      if(seen.has(path)) return;
      seen.add(path);
      paths.push(path);
    });
  });
  return paths;
}

function removePDFAttachmentFromResource(resource, pdfId){
  if(!resource || typeof resource !== "object") return null;
  normalizeResourcePDFs(resource);
  const removed = resource.pdfs.find(pdf => pdf.id === pdfId);
  if(!removed) return null;
  resource.pdfs = resource.pdfs.filter(pdf => pdf.id !== pdfId);
  if(typeof resource.pdf === "string" && resource.pdf.trim() === removed.path){
    delete resource.pdf;
  }
  return removed;
}

function isPDFPathReferencedInResources(resources, path){
  const key = String(path || "").trim();
  if(!key) return false;
  return (Array.isArray(resources) ? resources : []).some(resource => collectPDFPathsFromResource(resource).includes(key));
}

function isPDFPathReferenced(path){
  return isPDFPathReferencedInResources(data.resources || [], path);
}

function applyServicesBold(escapedText){
  return escapedText.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
}

function renderServicesHTML(text){
  const normalized = String(text || "").replace(/\r\n?/g, "\n");
  const lines = normalized.split("\n");
  const out = [];
  let listItems = [];

  function flushList(){
    if(!listItems.length) return;
    out.push(`<ul>${listItems.join("")}</ul>`);
    listItems = [];
  }

  lines.forEach(line => {
    const trimmed = line.trim();
    const isDivider = trimmed === "---";
    const bulletMatch = line.match(/^\s*(?:\*|-|•)\s+(.*)$/);

    if(isDivider){
      flushList();
      out.push("<hr>");
      return;
    }

    if(bulletMatch){
      const bulletText = applyServicesBold(escapeHTML(bulletMatch[1]));
      listItems.push(`<li>${bulletText}</li>`);
      return;
    }

    flushList();
    if(line === ""){
      out.push('<div class="services-line services-blank">&nbsp;</div>');
      return;
    }
    out.push(`<div class="services-line">${applyServicesBold(escapeHTML(line))}</div>`);
  });

  flushList();
  return out.join("");
}

// ============================================================
// SAFETY HARNESS
// ============================================================
// Catch runtime errors and (when debug is enabled) enforce invariants to prevent
// silent corruption during edits, imports, and rendering.

function showAppError(context, err){
  const banner = document.getElementById("appErrorBanner");
  const details = document.getElementById("appErrorDetails");
  if(!banner || !details) return;

  const message = err && err.message ? String(err.message) : String(err || "Unknown error");
  const stack = err && err.stack ? String(err.stack) : "";
  const timestamp = new Date().toISOString();
  details.textContent = [
    `Context: ${context}`,
    `Message: ${message}`,
    `Timestamp: ${timestamp}`,
    stack ? `Stack:\n${stack}` : ""
  ].filter(Boolean).join("\n");
  banner.style.display = "block";
}

function safeCall(label, fn){
  try{
    return fn();
  }catch(err){
    showAppError(label, err);
    return undefined;
  }
}

function assertInvariants(context = "invariant check"){
  if(!data || !Array.isArray(data.resources)) throw new Error(`${context}: data.resources must be an array`);
  if(!Array.isArray(data.categories)) throw new Error(`${context}: data.categories must be an array`);
  if(!Array.isArray(favorites)) throw new Error(`${context}: favorites must be an array`);

  const ids = new Set();
  data.resources.forEach((resource, idx) => {
    const id = String(resource && resource.id || "");
    if(!id) throw new Error(`${context}: resource at index ${idx} is missing id`);
    if(ids.has(id)) throw new Error(`${context}: duplicate resource id '${id}'`);
    ids.add(id);

    if(!Array.isArray(resource.tags)) throw new Error(`${context}: resource '${id}' tags must be an array`);
    if(!Array.isArray(resource.pdfs)) throw new Error(`${context}: resource '${id}' pdfs must be an array`);
    resource.pdfs.forEach((pdf, pdfIdx) => {
      if(!pdf || typeof pdf !== "object") throw new Error(`${context}: resource '${id}' pdf ${pdfIdx} must be an object`);
      if(!pdf.id) throw new Error(`${context}: resource '${id}' pdf ${pdfIdx} is missing id`);
      if(!pdf.path) throw new Error(`${context}: resource '${id}' pdf ${pdfIdx} is missing path`);
    });
    const resourceTagKeys = new Set();
    resource.tags.forEach(tag => {
      if(typeof tag !== "string" || tag !== tag.trim() || !tag){
        throw new Error(`${context}: resource '${id}' has invalid tag '${tag}'`);
      }
      const key = tag.toLowerCase();
      if(resourceTagKeys.has(key)){
        throw new Error(`${context}: resource '${id}' has duplicate tag '${tag}'`);
      }
      resourceTagKeys.add(key);
    });

    if(resource.verifiedOn != null && !isValidMMYY(resource.verifiedOn)){
      throw new Error(`${context}: resource '${id}' verifiedOn must be MM/YY or null`);
    }
  });

  const resourceIds = new Set(data.resources.map(r => String(r && r.id || "")));
  const badFavorite = favorites.find(id => !resourceIds.has(String(id || "")));
  if(badFavorite) throw new Error(`${context}: favorite '${badFavorite}' does not reference a valid resource`);
}

function safeRender(label = "render"){
  return safeCall(label, () => {
    if(DEBUG) assertInvariants(`${label} pre`);
    const result = render();
    if(DEBUG) assertInvariants(`${label} post`);
    return result;
  });
}

function safeRenderAdmin(label = "renderAdmin"){
  return safeCall(label, () => {
    if(DEBUG) assertInvariants(`${label} pre`);
    const result = renderAdmin();
    if(DEBUG) assertInvariants(`${label} post`);
    return result;
  });
}

// RENDERING — GENERAL
// ============================================================

function setView(nextView){
  if(nextView === "admin" && !isAdminVisible) return;
  if(view === "admin" && nextView !== "admin"){
    if(!commitPendingEditsIfChanged()) return;
  }
  if(nextView !== "category") expandedSearchResourceId = "";
  view = nextView;
  safeRender();
}

function setAdminVisibility(visible){
  const nextVisible = !!visible;
  if(!nextVisible && view === "admin"){
    setView("categories");
    if(view === "admin") return;
  }
  isAdminVisible = nextVisible;
  tabAdmin.style.display = isAdminVisible ? "" : "none";
  if(!isAdminVisible){
    const adminSection = document.getElementById("adminView");
    if(adminSection) adminSection.classList.add("hidden");
  }
}

function toggleAdminVisibility(){
  setAdminVisibility(!isAdminVisible);
  safeRender();
}

tabCategories.onclick = ()=>{ setView("categories"); };
tabFavorites.onclick = ()=>{ setView("favorites"); };
tabAdmin.onclick = ()=>{ setView("admin"); };

function syncSearchPanel(){
  const panel = document.getElementById("searchPanel");
  const input = document.getElementById("searchInput");
  if(!panel) return;
  panel.classList.toggle("hidden", !isSearchOpen);
  if(input && isSearchOpen && document.activeElement !== input){
    input.value = searchQuery;
  }
}

function closeSearchPanel(){
  isSearchOpen = false;
  syncSearchPanel();
}

function toggleSearchPanel(){
  isSearchOpen = !isSearchOpen;
  syncSearchPanel();
  if(isSearchOpen){
    window.setTimeout(() => {
      const input = document.getElementById("searchInput");
      if(input){
        input.focus();
        input.select();
      }
    }, 0);
  }
}

function performSearch(query){
  if(view === "admin" && !commitPendingEditsIfChanged()) return;
  searchQuery = String(query || "").trim();
  searchResults = buildSearchResults(searchQuery);
  expandedSearchResourceId = "";
  view = "search-results";
  safeRender();
}

const tabSearch = document.getElementById("tabSearch");
if(tabSearch) tabSearch.onclick = toggleSearchPanel;
const searchButton = document.getElementById("searchButton");
if(searchButton){
  searchButton.onclick = () => {
    const input = document.getElementById("searchInput");
    performSearch(input ? input.value : "");
  };
}
const searchCancelButton = document.getElementById("searchCancelButton");
if(searchCancelButton) searchCancelButton.onclick = closeSearchPanel;
const searchInput = document.getElementById("searchInput");
if(searchInput){
  searchInput.addEventListener("keydown", event => {
    if(event.key !== "Enter") return;
    event.preventDefault();
    performSearch(searchInput.value);
  });
}
const appTitle = document.getElementById("appTitle");
function toggleUpdateInfoView(){
  if(view === "recent-updates" && showUpdateInfo){
    showUpdateInfo = false;
    showRecentChangeLog = false;
    recentUpdateDetail = null;
    pendingRecentUpdates = [];
    view = "categories";
    safeRender();
    return;
  }
  showUpdateInfo = true;
  showRecentChangeLog = true;
  view = "recent-updates";
  const seen = getSeenUpdateIds();
  getRecentChanges().forEach(entry => seen.add(String(entry.id)));
  saveSeenUpdateIds(seen);
  safeRender();
}
if(appTitle) appTitle.onclick = toggleUpdateInfoView;

function getUnseenUpdates(){
  const seen = getSeenUpdateIds();
  return getRecentChanges().filter(entry => !seen.has(String(entry.id)));
}

function getCategoryUpdateMap(){
  const map = new Map();
  getUnseenUpdates().forEach(entry => {
    getCategoryIdsForChange(entry).forEach(catId => {
      if(!map.has(catId)) map.set(catId, []);
      map.get(catId).push(entry);
    });
  });
  return map;
}

  const card=document.createElement("div");

  card.addEventListener("click", event => {
    handleAdminListReferenceInspection(event, res);
  }, true);

  if(showStar){
    const star=document.createElement("div");
    star.className="star"+(favorites.includes(res.id)?" fav":"");
    star.textContent="★";
    star.onclick=e=>{e.stopPropagation(); toggleFav(res.id);};
    card.appendChild(star);
  }

  const main=document.createElement("div");
  main.className="resource-main";
  main.innerHTML=`<strong>${res.name}</strong>`;
  if(showDescription && res.description) main.innerHTML+=`<div>${escapeHTML(res.description)}</div>`;

  const details=document.createElement("div");
  details.className="resource-details "+(expanded?"expanded":"collapsed");

  let html="";
  const pdfs = getResourcePDFs(res);
  const websiteURL = normalizeWebsiteURL(res.website);
  if(res.phone) html+=`<div><strong>Phone:</strong> <a href="tel:${res.phone}">${res.phone}</a></div>`;
  if(res.address) html+=`<div><strong>Address:</strong> ${escapeHTML(res.address)}</div>`;
  if(websiteURL) html+=`<div><strong>Website:</strong> <a href="${websiteURL}" target="_blank">${res.website}</a></div>`;
  if(pdfs.length === 1){
    const label = pdfs[0].name && pdfs[0].name !== "PDF" ? pdfs[0].name : "Open PDF";
    html+=`<div><button type="button" class="button resource-pdf-button" data-pdf-index="0">${escapeHTML(label)}</button></div>`;
  }
  if(pdfs.length > 1){
    html+=`<div><strong>PDFs:</strong><div class="pdf-attachments-list">`;
    pdfs.forEach((pdf, index) => {
      html+=`<button type="button" class="button resource-pdf-button" data-pdf-index="${index}">${escapeHTML(pdf.name || "PDF")}</button>`;
    });
    html+=`</div></div>`;
  }
  if(res.servicesText) html+=`<div><strong>Services:</strong><div class="services-rendered">${renderServicesHTML(res.servicesText)}</div></div>`;

  details.innerHTML=html;
  details.querySelectorAll(".resource-pdf-button").forEach(btn => {
    btn.onclick = async e => {
      e.stopPropagation();
      const index = Number(btn.dataset.pdfIndex);
      const pdf = pdfs[index];
      if(pdf && pdf.path) await openPDF(pdf.path);
    };
  });
  main.appendChild(details);
  card.appendChild(main);
  return card;
}

function getCategoryFilterTags(categoryId){
  return Array.isArray(categoryTagFilters[categoryId]) ? categoryTagFilters[categoryId] : [];
}

function setCategoryFilterTags(categoryId, tags){
  const cleaned = normalizeResourceTags(tags);
  if(cleaned.length){
    categoryTagFilters[categoryId] = cleaned;
  }else{
    delete categoryTagFilters[categoryId];
  }
}

function clearAllCategoryFilters(shouldRender = true){
  categoryTagFilters = {};
  if(shouldRender && view === "category") safeRender();
}

function getResourceTagKeys(resource){
  return new Set(normalizeResourceTags(resource && resource.tags).map(tag => tag.toLowerCase()));
}

function countSelectedTagMatches(resource, activeTagKeys){
  if(!activeTagKeys.size) return 0;
  const resourceKeys = getResourceTagKeys(resource);
  let count = 0;
  activeTagKeys.forEach(key => {
    if(resourceKeys.has(key)) count += 1;
  });
  return count;
}

function resourceMatchesSelectedTags(resource, selectedTags){
  const activeTags = normalizeResourceTags(selectedTags);
  const activeTagKeys = new Set(activeTags.map(tag => tag.toLowerCase()));
  return !activeTagKeys.size || countSelectedTagMatches(resource, activeTagKeys) > 0;
}

function filterResourcesBySelectedTags(resources, selectedTags){
  const activeTags = normalizeResourceTags(selectedTags);
  const activeTagKeys = new Set(activeTags.map(tag => tag.toLowerCase()));
  return (Array.isArray(resources) ? resources : [])
    .filter(resource => resourceMatchesSelectedTags(resource, activeTags))
    .sort((a, b) => {
      if(activeTagKeys.size){
        const matchDiff = countSelectedTagMatches(b, activeTagKeys) - countSelectedTagMatches(a, activeTagKeys);
        if(matchDiff) return matchDiff;
      }
      return compareResourcesByName(a, b);
    });
}

function getCategoryResources(categoryId){
  return (Array.isArray(data.resources) ? data.resources : [])
    .filter(r => Array.isArray(r.categories) && r.categories.includes(categoryId));
}

function getTagsForCategory(categoryId){
  const tags = [];
  const seen = new Set();
  getCategoryResources(categoryId).forEach(resource => {
    normalizeResourceTags(resource.tags).forEach(tag => {
      const key = tag.toLowerCase();
      if(seen.has(key)) return;
      seen.add(key);
      tags.push(tag);
    });
  });
  return tags.sort((a,b)=>a.localeCompare(b, undefined, { sensitivity:"base" }));
}

function getCategoryTagOptions(categoryId){
  return getTagsForCategory(categoryId);
}

function getUndoSnapshot(){
  try{
    const raw = localStorage.getItem(UNDO_STORAGE_KEY);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    if(!parsed || typeof parsed !== "object") return null;
    if(!parsed.dataSnapshot || typeof parsed.message !== "string") return null;
    return parsed;
  }catch(_err){
    return null;
  }
}

function clearUndoSnapshot(){
  localStorage.removeItem(UNDO_STORAGE_KEY);
}

function setUndoSnapshot(message){
  localStorage.setItem(UNDO_STORAGE_KEY, JSON.stringify({
    dataSnapshot: JSON.parse(JSON.stringify(data)),
    message: String(message || "")
  }));
}

function undoLastDeletion(){
  const snapshot = getUndoSnapshot();
  if(!snapshot || !snapshot.dataSnapshot) return;
      data = snapshot.dataSnapshot;
      normalizeDataServicesShape(data);
      normalizeDataPDFShape(data);
      normalizeDataTagsShape(data);
      normalizeDataVerifiedOnShape(data);
      normalizeChanges(data);
  clearUndoSnapshot();
  persist();
  safeRender();
}

/* ---------- Print ---------- */

// PrintWorkflow is a small queue-based state machine for print preview/packet flow.
// Each queue entry has a label and render function so print steps stay data-driven.
const PrintWorkflow = {
  queue: [],
  currentIndex: -1,
  initiatedByButton: false,

  isListResource(res){
    if(!Array.isArray(res?.tags)) return false;
    return res.tags.some(tag => {
      return canonicalizeResourceTag(tag).toLowerCase() === "list";
    });
  },

  getFavoriteGroups(){
    // "List" resources are separated so favorites packet output can render flyers.
    const normalFavs = [];
    const listFavs = [];

    data.resources.filter(r=>favorites.includes(r.id)).forEach(res => {
      if(this.isListResource(res)){
        listFavs.push(res);
      }else{
        normalFavs.push(res);
      }
    });

    return { normalFavs, listFavs };
  },

  buildQueue(){
    const { normalFavs, listFavs } = this.getFavoriteGroups();
    if(!normalFavs.length && !listFavs.length) return [];
    if(!listFavs.length){
      return [{
        label:"Favorites",
        render: () => this.renderFavorites()
      }];
    }
    return [{
      label:"Favorites",
      render: () => this.renderFavoritesPacket()
    }];
  },

  updateUI(){
    const active = this.queue.length > 0 && this.currentIndex >= 0 && this.currentIndex < this.queue.length;
    const isLastStep = active && this.currentIndex === this.queue.length - 1;
    printCloseBtn.classList.toggle("hidden", active && !isLastStep);
    printNextBtn.classList.toggle("hidden", !active || isLastStep);
    if(!active){
      printProgress.textContent = "";
      return;
    }
    const step = this.queue[this.currentIndex];
    printProgress.textContent = `Printing ${this.currentIndex + 1} of ${this.queue.length}: ${step.label}. Use double-sided printing in the print dialog.`;
  },

  showStep(){
    const step = this.queue[this.currentIndex];
    if(!step || typeof step.render !== "function") return;
    step.render();
  },

  openPreviewContent(render){
    this.updateUI();
    printContent.innerHTML="";
    if(typeof render === "function") render(printContent);
    printModal.classList.remove("hidden");
  },

  openPreview(resources){
    this.openPreviewContent(container => {
      container.innerHTML="<h2>Suggested Resources</h2>";
      this.renderPrintableResourceCards(container, resources);
    });
  },

  renderPrintableResourceCards(container, resources){
    (Array.isArray(resources) ? resources : []).forEach((res, index)=>{
      if(index > 0){
        const separator = document.createElement("hr");
        separator.className = "print-resource-separator";
        container.appendChild(separator);
      }
      const card=buildResourceCard(res,{expanded:true,showStar:false});
      container.appendChild(card);
    });
  },

  renderFavorites(){
    const { normalFavs } = this.getFavoriteGroups();
    this.openPreview(normalFavs);
  },

  buildListFlyer(resource, shouldPageBreak){
    const flyer = document.createElement("section");
    flyer.className = "print-list-flyer" + (shouldPageBreak ? " print-list-flyer-page-break" : "");

    let html = `<h2>${escapeHTML(resource.name || "")}</h2>`;
    if(resource.phone) html += `<div class="print-list-field"><strong>Phone:</strong> ${escapeHTML(resource.phone)}</div>`;
    if(resource.address) html += `<div class="print-list-field"><strong>Address:</strong> ${escapeHTML(resource.address)}</div>`;
    if(resource.website) html += `<div class="print-list-field"><strong>Website:</strong> ${escapeHTML(resource.website)}</div>`;
    if(resource.servicesText){
      html += `<div class="print-list-field"><strong>Services:</strong><div class="services-rendered">${renderServicesHTML(resource.servicesText)}</div></div>`;
    }
    flyer.innerHTML = html;
    return flyer;
  },

  renderFavoritesPacket(){
    const { normalFavs, listFavs } = this.getFavoriteGroups();
    this.openPreviewContent(container => {
      if(normalFavs.length){
        container.innerHTML = "<h2>Suggested Resources</h2>";
        this.renderPrintableResourceCards(container, normalFavs);
      }

      listFavs.forEach((resource, index) => {
        container.appendChild(this.buildListFlyer(resource, normalFavs.length > 0 || index > 0));
      });
    });
  },

  renderSingleListResource(resourceId){
    const { listFavs } = this.getFavoriteGroups();
    const resource = listFavs.find(res => res.id === resourceId);
    if(!resource) return;
    this.openPreview([resource]);
  },

  startFavoritesPacket(){
    this.queue = this.buildQueue();
    if(!this.queue.length) return;
    this.currentIndex = 0;
    this.showStep();
  },

  next(){
    if(this.currentIndex >= this.queue.length - 1) return this.close();
    this.currentIndex += 1;
    this.showStep();
  },

  close(){
    this.queue = [];
    this.currentIndex = -1;
    this.updateUI();
    printModal.classList.add("hidden");
  },

  doPrint(){
    this.initiatedByButton = true;
    window.print();
    clearAllCategoryFilters(false);
  },

  handleAfterPrint(){
    if(!this.initiatedByButton) return;
    this.initiatedByButton = false;
  }
};

function startFavoritesPacketPrint(){ PrintWorkflow.startFavoritesPacket(); }
function nextPrintStep(){ PrintWorkflow.next(); }
function closePrintPreview(){ PrintWorkflow.close(); }
function doPrint(){ PrintWorkflow.doPrint(); }

// ============================================================
// PERSISTENCE
// ============================================================
// Storage split:
// - localStorage keeps the primary JSON snapshot ("tsoData").
// - IndexedDB keeps binary assets (PDF blobs) under string keys.
// - resource.pdfs stores PDF metadata; resource.pdf remains legacy-compatible.

function persist(){
  // Writes the canonical JSON snapshot used to restore app state on reload.
  if(DEBUG) assertInvariants("persist");
  data.appVersion = APP_VERSION;
  data.lastModified = nowISO();
  localStorage.setItem("tsoData", JSON.stringify(data));
}

function openAssetsDB(){
  // Opens the IndexedDB database used for PDF blob storage/retrieval.
  return new Promise((resolve, reject) => {
    if(typeof indexedDB === "undefined"){
      reject(new Error("Asset storage is unavailable in this browser."));
      return;
    }

    let settled = false;
    const timeoutId = setTimeout(() => {
      if(settled) return;
      settled = true;
      reject(new Error("Asset storage is unavailable right now. Reload the app and try again."));
    }, 4000);

    function finish(fn){
      return value => {
        if(settled) return;
        settled = true;
        clearTimeout(timeoutId);
        fn(value);
      };
    }

    let req;
    try{
      req = indexedDB.open("tsoAssets", 1);
    }catch(err){
      clearTimeout(timeoutId);
      reject(err);
      return;
    }

    req.onupgradeneeded = e => {
      const db = e.target.result;
      if(!db.objectStoreNames.contains("files")){
        db.createObjectStore("files");
      }
    };

    req.onsuccess = finish(() => resolve(req.result));
    req.onerror = finish(() => reject(req.error || new Error("Asset storage is unavailable in this browser.")));
    req.onblocked = finish(() => reject(new Error("Asset storage is blocked. Close other tabs and try again.")));
  });
}

async function saveAsset(key, blob){
  // Generic keyed binary write used by higher-level PDF helpers.
  const db = await openAssetsDB();
  const tx = db.transaction("files", "readwrite");
  tx.objectStore("files").put(blob, key);

  return new Promise((resolve, reject) => {
    tx.oncomplete = () => {
      db.close();
      resolve();
    };
    tx.onerror = () => {
      db.close();
      reject(tx.error);
    };
    tx.onabort = () => {
      db.close();
      reject(tx.error);
    };
  });
}

async function loadAsset(key){
  // Generic keyed binary read.
  const db = await openAssetsDB();
  const tx = db.transaction("files", "readonly");
  const req = tx.objectStore("files").get(key);

  return new Promise((resolve, reject) => {
    req.onsuccess = () => {
      db.close();
      resolve(req.result);
    };
    req.onerror = () => {
      db.close();
      reject(req.error);
    };
  });
}

async function getAsset(path){
  return loadAsset(path);
}

function ensurePDFBlob(value){
  if(value instanceof Blob){
    return value.type === "application/pdf"
      ? value
      : new Blob([value], { type: "application/pdf" });
  }
  return new Blob([value], { type: "application/pdf" });
}

async function savePDF(key, blob){
  // PDF-specific save wrapper to enforce PDF blob type.
  return saveAsset(key, ensurePDFBlob(blob));
}

async function getPDF(key){
  // Lookup PDF blob by the key/path stored in resource.pdfs[].path.
  return getAsset(key);
}

async function deleteAsset(key){
  const db = await openAssetsDB();
  const tx = db.transaction("files", "readwrite");
  tx.objectStore("files").delete(key);

  return new Promise((resolve, reject) => {
    tx.oncomplete = () => {
      db.close();
      resolve();
    };
    tx.onerror = () => {
      db.close();
      reject(tx.error);
    };
    tx.onabort = () => {
      db.close();
      reject(tx.error);
    };
  });
}

async function deletePDF(key){
  return deleteAsset(key);
}

async function openPDF(path){
  // Opens a resource PDF by resolving its key/path into an IndexedDB blob.
  const pdfWindow = window.open("", "_blank");
  if(!pdfWindow){
    alert("Unable to open PDF window. Allow pop-ups and try again.");
    return;
  }
  pdfWindow.document.title = "Loading PDF...";
  pdfWindow.document.body.textContent = "Loading PDF...";
  try{
    const stored = await getPDF(path);
    if(!stored){
      pdfWindow.close();
      alert("PDF not found.");
      return;
    }
    const pdfBlob = ensurePDFBlob(stored);
    const url = URL.createObjectURL(pdfBlob);
    pdfWindow.location = url;
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }catch(err){
    pdfWindow.close();
    alert("Unable to open PDF: " + err.message);
  }
}

async function clearAssets(){

    };

    };

function cloneDataObject(value){
  return JSON.parse(JSON.stringify(value || {}));
}

function getValidTimestamp(value){
  const timestamp = Date.parse(String(value || ""));
  return Number.isFinite(timestamp) ? timestamp : null;
}

function objectsDiffer(a, b){
  return JSON.stringify(a || {}) !== JSON.stringify(b || {});
}

function getSeenUpdateIds(){
  try{
    const parsed = JSON.parse(localStorage.getItem(UPDATE_SEEN_STORAGE_KEY) || "[]");
    return new Set(Array.isArray(parsed) ? parsed.map(String) : []);
  }catch(_err){
    return new Set();
  }
}

function saveSeenUpdateIds(seenSet){
  localStorage.setItem(UPDATE_SEEN_STORAGE_KEY, JSON.stringify(Array.from(seenSet)));
}

function normalizeChanges(packageData){
  if(!packageData || typeof packageData !== "object") return;
  const source = Array.isArray(packageData.changes) ? packageData.changes : [];
  const normalized = [];
  const seen = new Set();
  source.forEach((entry, index) => {
    if(!entry || typeof entry !== "object") return;
    const description = String(entry.description || "").trim();
    const type = entry.type === "category" ? "category" : "resource";
    const action = ["added", "updated", "removed"].includes(entry.action) ? entry.action : "updated";
    const timestamp = Date.parse(String(entry.timestamp || "")) ? String(entry.timestamp) : nowISO();
    const id = String(entry.id || `${type}:${entry.targetId || index}:${timestamp}`).trim();
    if(!id || seen.has(id)) return;
    seen.add(id);
    normalized.push({
      id,
      type,
      action,
      targetId: String(entry.targetId || ""),
      targetName: String(entry.targetName || "(Unnamed)").trim() || "(Unnamed)",
      description,
      timestamp,
      categoryIds: Array.isArray(entry.categoryIds) ? entry.categoryIds.map(String) : []
    });
  });
  packageData.changes = normalized;
}

function normalizePackageVersionValue(value){
  if(typeof value === "number" && Number.isFinite(value)) return value;
  if(typeof value === "string" && value.trim()){
    const asNumber = Number(value.trim());
    if(Number.isFinite(asNumber)) return asNumber;
  }
  return "Unknown";
}

function getNextPackageVersionValue(value){
  const normalized = normalizePackageVersionValue(value);
  if(typeof normalized === "number" && Number.isFinite(normalized)){
    return Math.max(1, Math.floor(normalized) + 1);
  }
  return 1;
}

function normalizeLastLoadedPackageInfo(packageData){
  if(!packageData || typeof packageData !== "object") return;
  const source = packageData.lastLoadedPackageInfo;
  if(!source || typeof source !== "object"){
    packageData.lastLoadedPackageInfo = null;
    return;
  }
  const changes = Array.isArray(source.changes)
    ? source.changes
      .map(entry => String(entry || "").trim())
      .filter(Boolean)
    : [];
  packageData.lastLoadedPackageInfo = {
    packageVersion: normalizePackageVersionValue(source.packageVersion),
    loadedAt: Date.parse(String(source.loadedAt || "")) ? String(source.loadedAt) : nowISO(),
    changes
  };
}

function createChangeEntry(type, action, targetId, targetName, description, options = {}){
  const cleanDescription = String(description || "").trim();
  const timestamp = nowISO();
  return {
    id: `${type || "change"}:${targetId || "unknown"}:${timestamp}:${Math.random().toString(16).slice(2,8)}`,
    type: type === "category" ? "category" : "resource",
    action: ["added", "updated", "removed"].includes(action) ? action : "updated",
    targetId: String(targetId || ""),
    targetName: String(targetName || "(Unnamed)").trim() || "(Unnamed)",
    description: cleanDescription,
    timestamp,
    categoryIds: Array.isArray(options.categoryIds) ? options.categoryIds.map(String) : []
  };
}

function addChangeEntry(changeEntry){
  if(!changeEntry) return;
  normalizeChanges(data);
  data.changes.push(changeEntry);
}

function mergeChanges(localChanges, incomingChanges){
  const merged = [];
  const seen = new Set();
  [localChanges, incomingChanges].forEach(list => {
    (Array.isArray(list) ? list : []).forEach(entry => {
      const id = String(entry && entry.id || "");
      if(!id || seen.has(id)) return;
      seen.add(id);
      merged.push(cloneDataObject(entry));
    });
  });
  return merged;
}

function getRecentChanges(){
  normalizeChanges(data);
  return data.changes.slice().sort((a,b)=>String(b.timestamp||"").localeCompare(String(a.timestamp||"")));
}

function markChangesViewed(changeIds){
  const seen = getSeenUpdateIds();
  (Array.isArray(changeIds) ? changeIds : []).forEach(id => {
    if(id) seen.add(String(id));
  });
  saveSeenUpdateIds(seen);
}

function getChangesForResource(resourceId, { unseenOnly = false } = {}){
  const seen = getSeenUpdateIds();
  return getRecentChanges().filter(entry => {
    return entry.type === "resource" &&
      String(entry.targetId || "") === String(resourceId || "") &&
      (!unseenOnly || !seen.has(String(entry.id)));
  });
}

function getCategoryIdsForChange(entry){
  if(!entry) return [];
  if(Array.isArray(entry.categoryIds) && entry.categoryIds.length) return entry.categoryIds.slice();
  if(entry.type === "category") return entry.targetId ? [String(entry.targetId)] : [];
  const res = data.resources.find(r => String(r && r.id || "") === String(entry.targetId || ""));
  return Array.isArray(res && res.categories) ? res.categories.slice() : [];
}

function getChangesForCategory(categoryId, { unseenOnly = false } = {}){
  const seen = getSeenUpdateIds();
  return getRecentChanges().filter(entry => {
    return getCategoryIdsForChange(entry).includes(categoryId) &&
      (!unseenOnly || !seen.has(String(entry.id)));
  });
}

function formatChangeEntryHTML(entry){
  const dateText = formatDateOnly(entry && entry.timestamp);
  const detail = `${entry && entry.type ? entry.type : ""} ${entry && entry.action ? entry.action : ""}`.trim();
  const description = String(entry && entry.description || "").trim();
  return `<strong>${escapeHTML(entry.targetName || "(Unnamed)")}</strong><div>${escapeHTML(dateText)}: ${escapeHTML(detail)}</div>${description ? `<div>${escapeHTML(description)}</div>` : ""}`;
}

function formatPackageChangeSummary(entry){
  const targetName = String(entry && entry.targetName || "(Unnamed)").trim() || "(Unnamed)";
  const description = String(entry && entry.description || "").trim();
  const fallback = `${entry && entry.type ? entry.type : ""} ${entry && entry.action ? entry.action : ""}`.trim();
  return `${targetName} - ${description || fallback || "updated"}`;
}

function buildPackageMergeSummary(summary){
  if(!summary || typeof summary !== "object") return [];
  const entries = [];
  [
    { names:summary.resourceNamesAdded, label:"Resource added" },
    { names:summary.resourceNamesUpdated, label:"Resource updated" },
    { names:summary.categoryNamesAdded, label:"Category added" },
    { names:summary.categoryNamesUpdated, label:"Category updated" }
  ].forEach(group => {
    (Array.isArray(group.names) ? group.names : []).forEach(name => {
      const cleanName = String(name || "").trim();
      if(cleanName) entries.push(`${cleanName} - ${group.label}`);
    });
  });
  return entries;
}

function chooseMergeObject(localItem, incomingItem){
  if(!localItem && incomingItem) return { item:incomingItem, changed:true };
  if(localItem && !incomingItem) return { item:localItem, changed:false };

  const localTime = getValidTimestamp(localItem.lastModified);
  const incomingTime = getValidTimestamp(incomingItem.lastModified);
  const differs = objectsDiffer(localItem, incomingItem);

  if(localTime !== null && incomingTime !== null){
    return incomingTime > localTime
      ? { item:incomingItem, changed:differs }
      : { item:localItem, changed:false };
  }
  if(localTime === null && incomingTime !== null) return { item:incomingItem, changed:differs };
  if(localTime !== null && incomingTime === null) return { item:localItem, changed:false };
  return differs
    ? { item:incomingItem, changed:true }
    : { item:localItem, changed:false };
}

function mergeItemsById(localItems, incomingItems, options = {}){
  const localList = Array.isArray(localItems) ? localItems : [];
  const incomingList = Array.isArray(incomingItems) ? incomingItems : [];
  const incomingById = new Map(incomingList.map(item => [String(item && item.id || ""), item]).filter(([id]) => id));
  const seen = new Set();
  const merged = [];
  const addedNames = [];
  const updatedNames = [];
  let added = 0;
  let updated = 0;

  localList.forEach(localItem => {
    const id = String(localItem && localItem.id || "");
    if(!id) return;
    const incomingItem = incomingById.get(id);
    const choice = chooseMergeObject(localItem, incomingItem);
    merged.push(cloneDataObject(choice.item));
    seen.add(id);
    if(incomingItem && choice.item === incomingItem && choice.changed){
      updated += 1;
      updatedNames.push(String(incomingItem.name || incomingItem.title || id));
    }
  });

  incomingList.forEach(incomingItem => {
    const id = String(incomingItem && incomingItem.id || "");
    if(!id || seen.has(id)) return;
    merged.push(cloneDataObject(incomingItem));
    seen.add(id);
    added += 1;
    addedNames.push(String(incomingItem.name || incomingItem.title || id));
  });

  return { merged, added, updated, addedNames, updatedNames };
}

function normalizePackageData(nextData){
  if(!nextData || typeof nextData !== "object") nextData = {};
  if(!Array.isArray(nextData.categories)) nextData.categories = [];
  if(!Array.isArray(nextData.resources)) nextData.resources = [];
  normalizeDataServicesShape(nextData);
  normalizeDataPDFShape(nextData);
  normalizeDataTagsShape(nextData);
  normalizeDataVerifiedOnShape(nextData);
  normalizeChanges(nextData);
  nextData.packageVersion = normalizePackageVersionValue(nextData.packageVersion);
  normalizeLastLoadedPackageInfo(nextData);
  return nextData;
}

function mergeResourcePackages(localData, incomingData){
  const local = normalizePackageData(cloneDataObject(localData));
  const incoming = normalizePackageData(cloneDataObject(incomingData));
  const categoryMerge = mergeItemsById(local.categories, incoming.categories, { kind:"categories" });
  const resourceMerge = mergeItemsById(local.resources, incoming.resources, { kind:"resources" });
  const mergedData = {
    ...local,
    ...incoming,
    categories: categoryMerge.merged,
    resources: resourceMerge.merged,
    changes: mergeChanges(local.changes, incoming.changes),
    tags: []
  };
  normalizePackageData(mergedData);
  return {
    mergedData,
    summary: {
      categoriesAdded: categoryMerge.added,
      categoriesUpdated: categoryMerge.updated,
      resourcesAdded: resourceMerge.added,
      resourcesUpdated: resourceMerge.updated,
      categoryNamesAdded: categoryMerge.addedNames,
      categoryNamesUpdated: categoryMerge.updatedNames,
      resourceNamesAdded: resourceMerge.addedNames,
      resourceNamesUpdated: resourceMerge.updatedNames
    }
  };
}

async function mergeZipAssets(zip, mergedData){
  const pdfKeys = collectPDFPathsFromResources(mergedData.resources);
  const missing = [];

  for(const key of pdfKeys){
    const entry = zip.file(key);
    if(entry && key.toLowerCase().endsWith(".pdf")){
      const blob = await entry.async("blob");
      await savePDF(key, blob);
    }else{
      let existing = null;
      try{
        existing = await getPDF(key);
      }catch(_err){}
      if(!existing) missing.push(key);
    }
  }
  return missing;
}

function applyMergedData(mergedData){
  normalizePackageData(mergedData);
  data = mergedData;
  persist();
  safeRender();
}

async function beginResourcePackageSave(){
  // Request a save target up front so browsers can honor the user gesture.
  const suggestedName = "tso-resource-package.zip";
  if(typeof window.showSaveFilePicker === "function"){
    const handle = await window.showSaveFilePicker({
      id: "tso-resource-package",
      startIn: "downloads",
      suggestedName,
      types: [{
        description: "TSO resource package",
        accept: {
          "application/zip": [".zip"]
        }
      }]
    });
    return { kind:"file-handle", handle, suggestedName };
  }
  return { kind:"download", suggestedName };
}

async function saveResourcePackageBlob(target, blob){
  if(target && target.kind === "file-handle" && target.handle){
    const writable = await target.handle.createWritable();
    try{
      await writable.write(blob);
      await writable.close();
    }catch(err){
      try{
        await writable.abort();
      }catch(_err){}
      throw err;
    }
    return;
  }

  const url = URL.createObjectURL(blob);
  try{
    const a = document.createElement("a");
    a.href = url;
    a.download = target && target.suggestedName ? target.suggestedName : "tso-resource-package.zip";
    document.body.appendChild(a);
    a.click();
    a.remove();
  }finally{
    URL.revokeObjectURL(url);
  }
}

async function exportPackage(){
  // Exports package ZIP: tso-resources.json + any referenced PDF blobs.
  if(!commitPendingEditsIfChanged()) return;

  if(typeof JSZip === "undefined"){
    alert("ZIP support is unavailable. Reload the app and try again.");
    return;
  }

  let previousPackageVersion;
  let packageVersionBumped = false;
  try{
    const saveTarget = await beginResourcePackageSave();
    const zip = new JSZip();
    normalizePackageData(data);
    previousPackageVersion = data.packageVersion;
    data.packageVersion = getNextPackageVersionValue(data.packageVersion);
    packageVersionBumped = true;
    zip.file("tso-resources.json", JSON.stringify(data, null, 2));

    const pdfKeys = collectPDFPathsFromResources(data.resources);

    for(const key of pdfKeys){
      const blob = await getPDF(key);
      if(blob){
        zip.file(key, blob);
      }
    }

    const blob = await zip.generateAsync({ type: "blob" });
    await saveResourcePackageBlob(saveTarget, blob);
    persist();
    showToast("Resource package saved");
  }catch(err){
    if(err && err.name === "AbortError") return;
    if(packageVersionBumped) data.packageVersion = previousPackageVersion;
    alert("Save failed: " + err.message);
  }
}

function beginMergeImportPackage(){
  // Opens a package ZIP picker for merge-based resource reload.
  if(!commitPendingEditsIfChanged()) return;

  const input = document.createElement("input");
  input.type = "file";
  input.accept = ".zip";
  input.style.display = "none";
  input.onchange = mergeImportPackage;
  document.body.appendChild(input);
  input.value = "";
  input.click();
}

function validateImportData(imported){
  // Validates imported tso-resources.json structure before merging current data.
  const errors = [];
  const warnings = [];

  if(!imported || typeof imported !== "object"){
    return { ok:false, errors:["File is not a valid JSON object"], warnings:[] };
  }

  if(!Array.isArray(imported.categories)){
    errors.push("Missing or invalid 'categories' array");
  }

  if(!Array.isArray(imported.resources)){
    errors.push("Missing or invalid 'resources' array");
  }

  const categoryIds = new Set();
  (Array.isArray(imported.categories) ? imported.categories : []).forEach((c, i) => {
    if(!c.id) errors.push(`Category at index ${i} is missing id`);
    if(!c.label) warnings.push(`Category '${c.id || i}' missing label`);
    if(c.id){
      if(categoryIds.has(c.id)){
        errors.push(`Duplicate category id '${c.id}'`);
      }
      categoryIds.add(c.id);
    }
  });

  const resourceIds = new Set();
  (Array.isArray(imported.resources) ? imported.resources : []).forEach((r, i) => {
    if(!r.id) errors.push(`Resource at index ${i} missing id`);
    if(!r.name) warnings.push(`Resource '${r.id || i}' missing name`);

    if(r.id){
      if(resourceIds.has(r.id)){
        errors.push(`Duplicate resource id '${r.id}'`);
      }
      resourceIds.add(r.id);
    }

    if(Array.isArray(r.categories)){
      r.categories.forEach(catId => {
        if(!categoryIds.has(catId)){
          warnings.push(`Resource '${r.id}' references unknown category '${catId}'`);
        }
      });
    }
  });

  return {
    ok: errors.length === 0,
    errors,
    warnings
  };
}

async function mergeImportPackage(event){
  // Imports package ZIP, validates JSON, merges data, then stores referenced PDFs.
  if(!commitPendingEditsIfChanged()){
    event.target.remove();
    return;
  }

  const file = event.target.files && event.target.files[0];
  if(!file){
    event.target.remove();
    return;
  }

  try{
    if(typeof JSZip === "undefined"){
      throw new Error("ZIP support is unavailable. Reload the app and try again.");
    }
    const zip = await JSZip.loadAsync(file);
    const jsonFile = zip.file("tso-resources.json");
    if(!jsonFile){
      alert("Package missing tso-resources.json");
      return;
    }

    const jsonText = await jsonFile.async("string");
    const imported = JSON.parse(jsonText);

    const report = validateImportData(imported);
    if(!report.ok){
      alert(
        "Load failed due to errors:\n\n" +
        report.errors.join("\n")
      );
      return;
    }
    normalizePackageData(imported);
    const importedChangeIds = new Set((imported.changes || []).map(entry => String(entry && entry.id || "")).filter(Boolean));
    const importedPackageVersion = normalizePackageVersionValue(imported.packageVersion);

    const localResourcesWithPdf = ((data && data.resources) || [])
      .map(r => ({ resource:r, paths:collectPDFPathsFromResource(r) }))
      .filter(item => item.paths.length);
    const { mergedData, summary:mergeSummary } = mergeResourcePackages(data, imported);
    const mergedById = new Map((mergedData.resources || []).map(r => [String(r && r.id || ""), r]));
    const resourcesWithPdf = localResourcesWithPdf
      .filter(item => {
        const mergedResource = mergedById.get(String(item.resource && item.resource.id || ""));
        const mergedPaths = new Set(collectPDFPathsFromResource(mergedResource));
        return item.paths.some(path => !mergedPaths.has(path));
      })
      .map(item => item.resource.name);

    const missingPdfPaths = await mergeZipAssets(zip, mergedData);
    applyMergedData(mergedData);
    const loadedChanges = getRecentChanges().filter(entry => importedChangeIds.has(String(entry.id || "")));
    const loadedChangeSummaries = loadedChanges.length
      ? loadedChanges.map(formatPackageChangeSummary)
      : buildPackageMergeSummary(mergeSummary);
    data.lastLoadedPackageInfo = {
      packageVersion: importedPackageVersion,
      loadedAt: nowISO(),
      changes: loadedChangeSummaries
    };
    normalizeLastLoadedPackageInfo(data);
    data.changes = [];
    persist();
    if(loadedChangeSummaries.length){
      pendingRecentUpdates = [];
      recentUpdateDetail = null;
      showUpdateInfo = true;
      showRecentChangeLog = false;
      view = "recent-updates";
      safeRender();
    }
    const warningBlocks = [];
    if(resourcesWithPdf.length > 0){
      warningBlocks.push(
        "The following PDFs were not preserved:\n\n" +
        resourcesWithPdf.map(name => `• ${name}`).join("\n")
      );
    }
    if(missingPdfPaths.length > 0){
      warningBlocks.push(
        "The package referenced PDF files that were not found in the zip:\n\n" +
        missingPdfPaths.map(path => `• ${path}`).join("\n")
      );
    }
    if(warningBlocks.length){
      alert(warningBlocks.join("\n\n"));
    }
    showToast("Resource package merged. You can delete the package zip when you are done.");
  }catch(e){
    alert("Load failed: " + e.message);
  }finally{
    // allow re-import of same filename
    event.target.value = "";
    event.target.remove();
  }
}

function getReferenceCategoryEntries(resource){
  const categoryIds = Array.isArray(resource && resource.categories)
    ? resource.categories.map(id => String(id || "")).filter(Boolean)
    : [];
  const categoryIdSet = new Set(categoryIds);
  const entries = [];
  const seen = new Set();

  (Array.isArray(data.categories) ? data.categories : [])
    .slice()
    .sort((a,b)=>(a.displayOrder??999)-(b.displayOrder??999))
    .forEach((cat, index) => {
      const id = String(cat && cat.id || "");
      if(!categoryIdSet.has(id)) return;
      const label = String(cat && cat.label || id || "Uncategorized");
      const key = label.toLowerCase();
      if(seen.has(key)) return;
      seen.add(key);
      entries.push({ label, order:index });
    });

  categoryIds.forEach(id => {
    if(entries.some(entry => entry.label === id)) return;
    if((data.categories || []).some(cat => String(cat && cat.id || "") === id)) return;
    const key = id.toLowerCase();
    if(seen.has(key)) return;
    seen.add(key);
    entries.push({ label:id, order:9999 });
  });

  if(!entries.length){
    entries.push({ label:"Uncategorized", order:9999 });
  }

  return entries;
}

function normalizeReferenceSearchText(value){
  return String(value || "")
    .toLowerCase()
    .normalize("NFKD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]+/g, " ")
    .trim()
    .replace(/\s+/g, " ");
}

function getReferenceTokens(value){
  const normalized = normalizeReferenceSearchText(value);
  return normalized ? normalized.split(" ") : [];
}

function textContainsTokenPhrase(text, phrase){
  const needleTokens = getReferenceTokens(phrase);
  const haystackTokens = getReferenceTokens(text);
  if(!needleTokens.length || haystackTokens.length < needleTokens.length) return false;

  for(let i = 0; i <= haystackTokens.length - needleTokens.length; i += 1){
    let matched = true;
    for(let j = 0; j < needleTokens.length; j += 1){
      if(haystackTokens[i + j] !== needleTokens[j]){
        matched = false;
        break;
      }
    }
    if(matched) return true;
  }
  return false;
}

function isReferenceNameSearchable(resourceName){
  const rawName = String(resourceName || "").trim();
  if(!rawName) return false;
  if(rawName.length >= 4) return true;
  if(/\s/.test(rawName)) return true;
  return /[A-Z]/.test(rawName) && rawName === rawName.toUpperCase();
}

function servicesTextReferencesName(servicesText, resourceName){
  if(!isReferenceNameSearchable(resourceName)) return false;
  return textContainsTokenPhrase(servicesText, resourceName);
}

function getReferenceSnippet(servicesText, resourceName){
  const text = String(servicesText || "").replace(/\s+/g, " ").trim();
  if(!text) return "";

  const lowerText = text.toLowerCase();
  const lowerName = String(resourceName || "").toLowerCase();
  const directIndex = lowerName ? lowerText.indexOf(lowerName) : -1;
  const center = directIndex >= 0 ? directIndex : 0;
  const start = Math.max(0, center - 70);
  const end = Math.min(text.length, center + Math.max(lowerName.length, 1) + 90);
  const prefix = start > 0 ? "... " : "";
  const suffix = end < text.length ? " ..." : "";
  return `${prefix}${text.slice(start, end)}${suffix}`;
}

function getResourceCategoryEntriesForSearch(resource){
  const categoryIds = Array.isArray(resource && resource.categories)
    ? resource.categories.map(id => String(id || "")).filter(Boolean)
    : [];
  const categoryIdSet = new Set(categoryIds);
  const entries = [];
  const seen = new Set();

  (Array.isArray(data.categories) ? data.categories : [])
    .slice()
    .sort((a,b)=>(a.displayOrder??999)-(b.displayOrder??999))
    .forEach((cat, index) => {
      const id = String(cat && cat.id || "");
      if(!categoryIdSet.has(id) || seen.has(id)) return;
      seen.add(id);
      entries.push({
        id,
        label:String(cat && cat.label || id || "Uncategorized"),
        order:index
      });
    });

  categoryIds.forEach(id => {
    if(seen.has(id)) return;
    seen.add(id);
    entries.push({ id, label:id, order:9999 });
  });

  return entries;
}

function addSearchResult(groupMap, groups, category, resource, options = {}){
  if(!category || !category.id || !resource) return;
  const groupKey = String(category.id);
  if(!groupMap.has(groupKey)){
    const group = { categoryId:category.id, categoryLabel:category.label, categoryOrder:category.order, items:[], seen:new Set() };
    groupMap.set(groupKey, group);
    groups.push(group);
  }
  const group = groupMap.get(groupKey);
  const resourceId = String(resource.id || "");
  if(group.seen.has(resourceId)) return;
  group.seen.add(resourceId);
  group.items.push({
    resourceId,
    resourceName:String(resource.name || "(Unnamed resource)"),
    snippet:String(options.snippet || "")
  });
}

function buildSearchResults(query){
  const cleanQuery = String(query || "").trim();
  const empty = { query:cleanQuery, mode:"none", groups:[] };
  if(!getReferenceTokens(cleanQuery).length) return empty;

  const resources = Array.isArray(data.resources) ? data.resources : [];
  let groups = [];
  let groupMap = new Map();

  resources.forEach(resource => {
    if(!textContainsTokenPhrase(resource && resource.name, cleanQuery)) return;
    getResourceCategoryEntriesForSearch(resource).forEach(category => {
      addSearchResult(groupMap, groups, category, resource);
    });
  });

  if(groups.length){
    return { query:cleanQuery, mode:"name", groups:sortSearchResultGroups(groups) };
  }

  groups = [];
  groupMap = new Map();
  resources.forEach(resource => {
    if(!textContainsTokenPhrase(resource && resource.servicesText, cleanQuery)) return;
    getResourceCategoryEntriesForSearch(resource).forEach(category => {
      addSearchResult(groupMap, groups, category, resource, {
        snippet:getReferenceSnippet(resource && resource.servicesText, cleanQuery)
      });
    });
  });

  return { query:cleanQuery, mode:groups.length ? "services" : "none", groups:sortSearchResultGroups(groups) };
}

function sortSearchResultGroups(groups){
  return (Array.isArray(groups) ? groups : [])
    .map(group => ({
      ...group,
      items:group.items.slice().sort((a,b)=>a.resourceName.localeCompare(b.resourceName, undefined, { sensitivity:"base" }))
    }))
    .sort((a, b) => {
      if(a.categoryOrder !== b.categoryOrder) return a.categoryOrder - b.categoryOrder;
      return a.categoryLabel.localeCompare(b.categoryLabel, undefined, { sensitivity:"base" });
    });
}

function openSearchResult(categoryId, resourceId){
  const nextCategory = String(categoryId || "");
  const nextResource = String(resourceId || "");
  if(!nextCategory || !nextResource) return;
  currentCategory = nextCategory;
  setCategoryFilterTags(currentCategory, []);
  expandedSearchResourceId = nextResource;
  isSearchOpen = false;
  view = "category";
  safeRender();
}

function resourceHasListTag(resource){
  return normalizeResourceTags(resource && resource.tags)
    .some(tag => tag.toLowerCase() === "list");
}

function resourceIsListStyle(resource){
  if(resourceHasListTag(resource)) return true;
  return String(resource && resource.servicesText || "").trim().length > 500;
}

function findReferencingLists(resourceOrName){
  const targetId = resourceOrName && typeof resourceOrName === "object"
    ? String(resourceOrName.id || "")
    : "";
  const resourceName = resourceOrName && typeof resourceOrName === "object"
    ? resourceOrName.name
    : resourceOrName;
  const needle = String(resourceName || "").trim();
  if(!isReferenceNameSearchable(needle)) return [];

  const matches = [];
  const seen = new Set();
  (Array.isArray(data.resources) ? data.resources : []).forEach(resource => {
    const resourceId = String(resource && resource.id || "");
    if(targetId && resourceId === targetId) return;
    if(!resourceIsListStyle(resource)) return;
    const servicesText = String(resource && resource.servicesText || "");
    if(!servicesTextReferencesName(servicesText, needle)) return;

    const listName = String(resource && resource.name || "(Unnamed list)");
    const key = String(resource && resource.id || listName).toLowerCase();
    if(seen.has(key)) return;
    seen.add(key);
    const categoryEntries = getReferenceCategoryEntries(resource);
    matches.push({
      categoryLabels: categoryEntries.map(category => category.label),
      categoryOrder: Math.min(...categoryEntries.map(category => category.order)),
      listName,
      snippet: getReferenceSnippet(servicesText, needle)
    });
  });

  return matches.sort((a, b) => {
    if(a.categoryOrder !== b.categoryOrder) return a.categoryOrder - b.categoryOrder;
    return a.listName.localeCompare(b.listName, undefined, { sensitivity:"base" });
  });
}

function getReferenceModal(){
  let modal = document.getElementById("referenceModal");
  if(modal) return modal;

  modal = document.createElement("div");
  modal.id = "referenceModal";
  modal.className = "reference-modal hidden";
  modal.addEventListener("click", event => {
    if(event.target === modal) closeReferenceModal();
  });
  document.body.appendChild(modal);
  return modal;
}

function closeReferenceModal(){
  const modal = document.getElementById("referenceModal");
  if(modal) modal.classList.add("hidden");
}

function showReferenceModal(resourceName, matches){
  const modal = getReferenceModal();
  const matchItems = Array.isArray(matches) ? matches : [];
  const bodyHTML = matchItems.length
    ? matchItems.map(match => {
      const categoryLabels = Array.isArray(match && match.categoryLabels) && match.categoryLabels.length
        ? match.categoryLabels
        : ["Uncategorized"];
      return `
        <div class="reference-match">
          <div class="reference-match-name">${escapeHTML(match && match.listName || "(Unnamed list)")}</div>
          <div class="reference-match-categories">Categories: ${escapeHTML(categoryLabels.join(", "))}</div>
          ${match && match.snippet ? `<div class="reference-match-snippet">${escapeHTML(match.snippet)}</div>` : ""}
        </div>
      `;
    }).join("")
    : `<p class="reference-empty">No list resources reference this resource.</p>`;

  modal.innerHTML = `
    <div class="reference-modal-panel" role="dialog" aria-modal="true" aria-labelledby="referenceModalTitle" aria-describedby="referenceModalSubtitle">
      <div class="reference-modal-header">
        <div>
          <div id="referenceModalTitle" class="reference-modal-title">Referenced By Lists</div>
          <div id="referenceModalSubtitle" class="reference-modal-subtitle">${escapeHTML(resourceName)}</div>
        </div>
        <button class="button reference-modal-close" type="button">Close</button>
      </div>
      <div class="reference-modal-body">${bodyHTML}</div>
    </div>
  `;

  const closeBtn = modal.querySelector(".reference-modal-close");
  if(closeBtn) closeBtn.addEventListener("click", closeReferenceModal);
  modal.classList.remove("hidden");
  if(closeBtn) closeBtn.focus();
}

function handleAdminResourceReferenceClick(event, sel){
  if(!event.altKey) return;
  window.setTimeout(() => {
    if(!(view === "admin" && adminTab === "resources" && !adminResourceEditMode)) return;
    const resourceId = sel && sel.value ? String(sel.value) : "";
    const resource = (data.resources || []).find(res => String(res && res.id || "") === resourceId);
    const resourceName = String(resource && resource.name || "").trim();
    if(!resourceName) return;
    selectedResourceId = resourceId;
    showReferenceModal(resourceName, findReferencingLists(resource));
  }, 0);
}

function handleAdminListReferenceInspection(event, resource){
  if(!event.altKey || !isAdminVisible) return false;
  const resourceName = String(resource && resource.name || "").trim();
  if(!resourceName) return false;

  event.preventDefault();
  event.stopPropagation();
  event.stopImmediatePropagation();
  showReferenceModal(resourceName, findReferencingLists(resource));
  return true;
}

function switchAdminTab(nextTab){
  if(adminTab === nextTab) return;
  if(!["categories", "resources", "tags"].includes(nextTab)) return;
  if(!commitPendingEditsIfChanged()) return;
  if(nextTab !== "resources"){
    adminResourceEditMode = false;
  }
  adminTab = nextTab;
  safeRenderAdmin();
}

function categoryEditorDraft(){
  // Capture category editor form state as a plain draft object.
  const labelEl = document.getElementById("cat_label");
  const orderEl = document.getElementById("cat_order");
  const updateEl = document.getElementById("cat_update_description");
  if(!labelEl || !orderEl || !editing || editing.kind !== "category") return null;
  const cat = data.categories[editing.idx];
  if(!cat) return null;
  return {
    id: cat.id || generateResourceId(),
    label: labelEl.value.trim(),
    displayOrder: orderEl.value,
    updateDescription: updateEl ? updateEl.value.trim() : ""
  };
}

function resourceEditorDraft(){
  // Capture resource editor form state as a plain draft object.
  const nameEl = document.getElementById("res_name");
  const phoneEl = document.getElementById("res_phone");
  const addressEl = document.getElementById("res_address");
  const websiteEl = document.getElementById("res_website");
  const hoursEl = document.getElementById("res_hours");
  const descEl = document.getElementById("res_description");
  const servicesEl = document.getElementById("res_services");
  const tagsEl = document.getElementById("res_tags");
  const updateEl = document.getElementById("res_update_description");
  if(!nameEl || !phoneEl || !addressEl || !websiteEl || !hoursEl || !descEl || !servicesEl || !tagsEl) return null;
  const verifiedEl = document.getElementById("res_verified_on");
  const verifiedOn = verifiedEl ? verifiedEl.value.trim() : "";
  const pdfs = editing?.kind === "resource"
    ? getResourcePDFs(data.resources[editing.idx]).map(pdf => ({ ...pdf }))
    : [];
  const tags = parseResourceTagsInput(tagsEl.value);

  return {
    name: nameEl.value.trim(),
    phone: phoneEl.value.trim(),
    address: addressEl.value.trim(),
    website: websiteEl.value.trim(),
    hours: hoursEl.value.trim(),
    description: descEl.value,
    servicesText: servicesEl.value,
    pdfs,
    verifiedOn,
    categories: Array.from(document.querySelectorAll(".resCat"))
      .filter(cb=>cb.checked)
      .map(cb=>cb.value)
      .sort(),
    tags,
    updateDescription: updateEl ? updateEl.value.trim() : ""
  };
}

function getResourceIndexById(resourceId){
  if(!resourceId) return -1;
  return data.resources.findIndex(r => r && r.id === resourceId);
}

function validateResourceName(draft, idx){
  // Prevent empty names and duplicates before applying/persisting resource edits.
  const name = String(draft && draft.name || "").trim();
  if(!name){
    return { valid:false, message:"Name is required." };
  }
  const lower = name.toLowerCase();
  const duplicate = data.resources.some((r, i) => i !== idx && String(r && r.name || "").trim().toLowerCase() === lower);
  if(duplicate){
    return { valid:false, message:"Another resource already uses this name." };
  }
  return { valid:true, message:"" };
}

function normalizeCategoryName(name){
  return String(name || "").trim().toLowerCase();
}

function categoryNameExists(name, excludeId){
  const normalizedName = normalizeCategoryName(name);
  if(!normalizedName) return false;
  return (Array.isArray(data.categories) ? data.categories : []).some(cat => {
    if(excludeId && String(cat && cat.id || "") === String(excludeId)) return false;
    return normalizeCategoryName(cat && cat.label) === normalizedName;
  });
}

function validateCategoryDraft(draft){
  // Delegate numeric display-order checks to browser input validity.
  const orderInput = document.getElementById("cat_order");
  if(orderInput && !orderInput.checkValidity()){
    return { valid:false, message:orderInput.validationMessage || "Display order must be a number." };
  }
  if(categoryNameExists(draft && draft.label, draft && draft.id)){
    return { valid:false, message:"Category already exists." };
  }
  return { valid:true, message:"" };
}

function showResourceNameWarning(message){
